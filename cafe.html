<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Cake · Menú del café</title>
<meta name="description" content="Menú de Cake, café y pastelería en Córdoba 417, Corrientes. Dulces, bebidas, salados y almuerzos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="app-style">
/* =========================================================================
   CAKE · Menú del café + carrito + panel de administración
   Paleta: crema #F3E9DC · caramelo #C08552 · café #895737 · chocolate #5E3023
   ========================================================================= */
:root{
  --ground:#F3E9DC; --surface:#FFFBF4; --surface-2:#E9DAC5;
  --ink:#3A1C12; --ink-soft:#7A4B30; --ink-faint:#9C7452;
  --accent:#895737; --accent-ink:#FFFBF4; --accent-soft:#E9DAC5;
  --caramel:#C08552; --brownie:#5E3023;
  --line:#DCC7AC; --line-strong:#C2A47F;
  --draw:#C08552; --wa:#1F7A3D; --promo:#A34426;
  --radius:18px; --shadow:0 1px 3px rgba(58,28,18,.07);
}
/* La página va siempre con los colores de la marca, sin modo oscuro
   automático: la crema y el marrón son parte de la identidad. */
:root{ color-scheme: light; }

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;}
body{background:var(--ground); color:var(--ink);
  font-family:'Karla', ui-sans-serif, system-ui, sans-serif; font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:'Fraunces',serif; font-weight:600; margin:0; letter-spacing:-.01em;}
/* Safari en iPhone le pone su propio azul a los botones si no se lo aclarás */
button{font:inherit; cursor:pointer; color:inherit; -webkit-appearance:none; appearance:none;}
.wrap{max-width:1180px; margin:0 auto; padding-inline:14px;}
@media (min-width:620px){ .wrap{padding-inline:18px;} }

/* fondo con cafecitos */
#bg{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; color:var(--draw);}
#bg span{position:absolute; display:block; opacity:.16;
  animation:flota 11s ease-in-out infinite;}
#bg span svg{display:block;}
#bg .b1{top:6%;  left:-5%;  width:118px; animation-delay:0s;}    #bg .b1 svg{transform:rotate(-12deg);}
#bg .b2{top:19%; right:-6%; width:146px; opacity:.1; animation-delay:-2.2s;} #bg .b2 svg{transform:rotate(9deg);}
#bg .b3{top:36%; left:-7%;  width:130px; animation-delay:-4.4s;} #bg .b3 svg{transform:rotate(7deg);}
#bg .b4{top:52%; right:-4%; width:108px; opacity:.1; animation-delay:-6.6s;} #bg .b4 svg{transform:rotate(-8deg);}
#bg .b5{top:68%; left:-4%;  width:124px; animation-delay:-8.8s;} #bg .b5 svg{transform:rotate(11deg);}
#bg .b6{top:84%; right:-6%; width:134px; opacity:.1; animation-delay:-1.1s;} #bg .b6 svg{transform:rotate(-6deg);}

/* ---------- animaciones ---------- */
@keyframes flota{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-16px)} }
@keyframes sube{ from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:none} }
@keyframes pop{ 0%{transform:scale(1)} 42%{transform:scale(1.16)} 100%{transform:scale(1)} }
@keyframes barraSube{ from{transform:translateY(100%)} to{transform:none} }
@keyframes aparece{ from{opacity:0; transform:scale(.95) translateY(12px)} to{opacity:1; transform:none} }
@keyframes latido{ 0%,100%{transform:scale(1)} 30%{transform:scale(1.1)} }

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{ animation:none !important; transition:none !important; }
}

/* la bolsita que vuela al carrito */
.volador{position:fixed; z-index:90; pointer-events:none;
  filter:drop-shadow(0 8px 16px rgba(58,28,18,.3));}
.volador svg{width:100%; height:100%; display:block;}
@media (min-width:1100px){
  #bg .b1{left:1%;} #bg .b2{right:2%;} #bg .b3{left:0;}
  #bg .b4{right:1%;} #bg .b5{left:2%;} #bg .b6{right:0;}
}
#veil{position:fixed; inset:0; z-index:1; pointer-events:none;
  background:radial-gradient(120% 70% at 50% 0%, transparent 44%, var(--ground) 100%);}
#app{position:relative; z-index:2;}

/* encabezado */
header.top{background:color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line); position:sticky; top:env(safe-area-inset-top,0px); z-index:30;}
.top-in{display:flex; align-items:center; gap:9px; padding-block:8px;
  transition:padding-block .22s ease;}
.logo-slot{width:44px; height:44px; flex:none; border-radius:50%; border:1.5px solid var(--line-strong);
  background:var(--surface); display:grid; place-items:center; overflow:hidden; position:relative;
  font-family:'Fraunces',serif; font-size:21px; font-weight:600; color:var(--accent); line-height:1;
  transition:width .22s ease, height .22s ease;}

/* al bajar, el encabezado se achica y devuelve pantalla */
body.compacto .top-in{padding-block:5px;}
body.compacto .logo-slot{width:32px; height:32px;}
body.compacto .brand .nm{font-size:17px;}
body.compacto .brand .sub{opacity:0; max-height:0; margin-top:0;}
.brand .nm{transition:font-size .22s ease;}
.brand .sub{transition:opacity .18s ease, max-height .22s ease, margin-top .22s ease;
  max-height:14px; overflow:hidden;}
@media (min-width:620px){
  body.compacto .logo-slot{width:40px; height:40px;}
  body.compacto .brand .nm{font-size:21px;}
  body.compacto .top-in{padding-block:6px;}
}
.logo-slot img{position:absolute; left:50%; top:50%; width:226%; height:auto; max-width:none;
  transform:translate(-46.6%,-45.6%); display:block;}
.brand{display:flex; flex-direction:column; margin-right:auto; min-width:0;}
.brand .nm{font-family:'Fraunces',serif; font-size:26px; font-weight:600; line-height:1;}
.brand .sub{font-size:8.2px; letter-spacing:.26em; text-transform:uppercase; color:var(--ink-soft);
  font-weight:700; margin-top:5px;}
@media (min-width:620px){
  .top-in{gap:10px; padding-block:11px;}
  .brand .nm{font-size:32px;} .brand .sub{font-size:10px; letter-spacing:.3em;}
}
.top-wa{display:none;}
@media (min-width:900px){ .top-wa{display:inline-flex;} }
/* el candado no se ve: se entra agregando #admin al final de la dirección */
.adm-btn{display:none;}
body.modoadmin .adm-btn{flex:none; width:36px; height:36px; border-radius:50%;
  border:1.5px solid var(--line-strong); background:var(--surface); color:var(--ink-faint);
  display:grid; place-items:center;}
.adm-btn svg{width:15px; height:15px;}
.adm-btn:hover{border-color:var(--accent); color:var(--accent);}
.adm-btn.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}

/* botones */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; border:none;
  border-radius:999px; padding:11px 19px; font-weight:700; font-size:14.5px; text-decoration:none;
  background:var(--accent); color:var(--accent-ink); transition:transform .14s, filter .14s; min-height:44px;}
.btn:active{transform:scale(.97);}
.btn.wa{background:var(--wa); color:#fff;}
.btn.sm{padding:8px 15px; font-size:13.5px; min-height:0;}
.btn.ghost{background:transparent; color:var(--ink); border:1.5px solid var(--line-strong); font-weight:600;}
.btn.danger{background:var(--promo); color:#fff;}
.btn svg{width:17px; height:17px; flex:none;}

/* hero */
.hero{padding-block:16px 2px; text-align:center;}
.hero .eyebrow{font-size:8.5px; letter-spacing:.2em; text-transform:uppercase; font-weight:700;
  color:var(--ink-faint); margin-bottom:7px;}
.hero h1{font-size:clamp(23px,6.6vw,36px); line-height:1.1;}
.hero h1 em{font-style:italic; color:var(--accent);}
.hero p.lead{max-width:46ch; margin:8px auto 0; color:var(--ink-soft); font-size:14px;}
@media (min-width:620px){
  .hero{padding-block:22px 4px;}
  .hero .eyebrow{font-size:9.5px; margin-bottom:10px;}
  .hero p.lead{font-size:16px; margin-top:11px;}
}

/* anuncios */
.anuncios{margin-top:16px; display:grid; gap:8px;}
.anuncio{display:flex; align-items:center; gap:10px; background:var(--surface);
  border:1px solid var(--line); border-left:4px solid var(--caramel);
  border-radius:12px; padding:11px 15px; font-size:14.5px;}
.anuncio .dot{width:7px; height:7px; border-radius:50%; background:var(--caramel); flex:none;}
.anuncio .ax{margin-left:auto; border:none; background:none; color:var(--accent);
  font-size:12.5px; font-weight:700; text-decoration:underline;}

/* ---------- LAYOUT: panel al costado + grilla ---------- */
.layout{display:block; margin-block:14px 30px;}
@media (min-width:900px){
  .layout{display:grid; grid-template-columns:238px minmax(0,1fr); gap:32px; align-items:start;}
}
.side{display:none;}
@media (min-width:900px){
  .side{display:block; position:sticky; top:calc(88px + env(safe-area-inset-top,0px));
    max-height:calc(100vh - 110px); overflow-y:auto; overscroll-behavior:contain;
    padding-right:6px; scrollbar-width:thin;}
  .side::-webkit-scrollbar{width:7px;}
  .side::-webkit-scrollbar-thumb{background:var(--line-strong); border-radius:99px;}
  .side::-webkit-scrollbar-track{background:transparent;}
}
/* en celular, buscador + categorías pegados arriba */
.cinta{display:block; position:sticky; z-index:26; margin-bottom:14px;
  top:calc(env(safe-area-inset-top,0px) + var(--htop, 60px));
  background:color-mix(in srgb, var(--ground) 94%, transparent);
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  padding-block:9px; border-bottom:1px solid var(--line);
  margin-inline:-14px; padding-inline:14px;}
@media (min-width:900px){ .cinta{display:none;} }
.cinta .chips{display:flex; gap:7px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px;}
.cinta .chips::-webkit-scrollbar{display:none;}
.cinta .chip{flex:none; white-space:nowrap; min-height:36px; padding:6px 13px; font-size:13.5px;}
.cinta .buscador{margin-bottom:8px;}

.sblock{margin-bottom:24px;}
.sblock > h3{font-size:12.5px; letter-spacing:.04em; color:var(--ink);
  font-family:'Karla',sans-serif; font-weight:700; margin-bottom:10px;
  display:flex; align-items:center; gap:8px;}
.sblock > h3 .step{flex:none; width:21px; height:21px; border-radius:50%; background:var(--accent);
  color:var(--accent-ink); font-size:11.5px; display:grid; place-items:center; font-weight:700;}
.chips{display:flex; gap:7px; flex-wrap:wrap;}
.chip{border:1.5px solid var(--line-strong); background:var(--surface); color:var(--ink-soft);
  border-radius:999px; padding:8px 14px; font-size:14px; font-weight:600; min-height:40px;
  display:inline-flex; align-items:center; gap:7px;
  transition:transform .14s, background .14s, color .14s, border-color .14s;}
.chip:active{transform:scale(.95);}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
.chip .n{font-size:11.5px; opacity:.7; font-variant-numeric:tabular-nums;}
.side .chips .chip{justify-content:space-between; width:100%;}

.buscador{position:relative; margin-bottom:6px;}
.buscador input{width:100%; border:1.5px solid var(--line-strong); background:var(--surface);
  color:var(--ink); border-radius:999px; padding:10px 15px 10px 38px; font:inherit; font-size:14.5px;}
.buscador svg{position:absolute; left:13px; top:50%; transform:translateY(-50%);
  width:15px; height:15px; color:var(--ink-faint);}

.sinfo{background:var(--surface); border:1px solid var(--line); border-radius:16px;
  padding:15px 17px; font-size:13.5px; color:var(--ink-soft);}
.sinfo b{display:block; font-family:'Karla',sans-serif; font-size:10.5px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--accent); margin-bottom:7px;}
.sinfo p{margin:0 0 6px;}
.sinfo p:last-child{margin:0;}

/* ---------- secciones y tarjetas ---------- */
section.cat{margin-bottom:26px; scroll-margin-top:150px;}
.cat-head{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.cat-head svg{width:24px; height:24px; flex:none; color:var(--caramel);}
.cat-head h2{font-size:21px; letter-spacing:-.015em;}
.cat-head .note{font-size:12px; color:var(--ink-soft); width:100%; line-height:1.35;}
.cat-head .ax{margin-left:auto; border:1.5px solid var(--line-strong); background:var(--surface);
  color:var(--accent); border-radius:999px; padding:5px 12px; font-size:12.5px; font-weight:700;}
.rule{height:2px; background:var(--line); margin:9px 0 14px;}
@media (min-width:620px){
  section.cat{margin-bottom:34px;}
  .cat-head svg{width:30px; height:30px;}
  .cat-head h2{font-size:26px;}
  .cat-head .note{font-size:13px;}
  .rule{margin:11px 0 20px;}
}

.grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px;}
@media (min-width:620px){ .grid{grid-template-columns:repeat(auto-fill,minmax(214px,1fr)); gap:15px;} }

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  overflow:hidden; display:flex; flex-direction:column; box-shadow:var(--shadow); position:relative;
  transition:transform .16s ease, box-shadow .22s ease, border-color .22s ease;}
.card:active{transform:scale(.982);}
@media (hover:hover){
  .card:hover{transform:translateY(-3px); box-shadow:0 10px 26px rgba(58,28,18,.14);}
  .card:hover .ph img{transform:scale(1.07);}
}
.grid.anim .card{animation:sube .42s cubic-bezier(.2,.7,.3,1) both;
  animation-delay:calc(var(--i, 0) * 45ms);}
.card.off{opacity:.45;}
.card .ph{aspect-ratio:1/1; background:var(--surface-2); position:relative; overflow:hidden;}
.card .ph.clic{cursor:zoom-in;}
.card .ph img{width:100%; height:100%; object-fit:cover; position:relative; z-index:1; display:block;
  transition:transform .55s cubic-bezier(.2,.7,.3,1);}
.card .ph .mark{position:absolute; inset:0; display:grid; place-items:center; color:var(--line-strong);}
.card .ph .mark svg{width:52px;}
.card .ph .falta{position:absolute; left:0; right:0; bottom:0; z-index:2; text-align:center;
  font-size:10px; letter-spacing:.14em; text-transform:uppercase; font-weight:700;
  color:var(--ink-faint); padding:6px 4px; background:color-mix(in srgb, var(--surface) 80%, transparent);}
.tagtop{position:absolute; left:9px; top:9px; z-index:3; background:var(--caramel); color:var(--brownie);
  border-radius:999px; padding:4px 10px; font-size:9.5px; letter-spacing:.12em;
  text-transform:uppercase; font-weight:700;}
.offtag{position:absolute; right:9px; top:9px; z-index:3; background:var(--promo); color:#fff;
  border-radius:999px; padding:5px 11px; font-size:12px; font-weight:700; letter-spacing:.02em;}
.card .pr .antes{font-size:11.5px; color:var(--ink-faint); text-decoration:line-through;
  font-weight:700; margin-right:5px;}
@media (min-width:620px){ .card .pr .antes{font-size:13.5px; margin-right:7px;} }
.offtag{font-size:10.5px; padding:4px 8px;}
@media (min-width:620px){ .offtag{font-size:12px; padding:5px 11px;} }
.tagtop{font-size:8px; padding:3px 7px; letter-spacing:.08em;}
@media (min-width:620px){ .tagtop{font-size:9.5px; padding:4px 10px; letter-spacing:.12em;} }
.card.conoff{border-color:var(--promo);}

.card .body{padding:10px 11px 0; display:flex; flex-direction:column; gap:3px; flex:1;}
.card .nm{font-family:'Fraunces',serif; font-size:15.5px; font-weight:600; line-height:1.15; color:var(--ink);}
.card .ds{font-size:11.4px; color:var(--ink-faint); line-height:1.33;}
.card .ds b{color:var(--ink-soft); font-weight:700;}
.card .pr{margin-top:auto; padding-top:7px; font-size:18px; font-weight:700; color:var(--accent);
  font-variant-numeric:tabular-nums; line-height:1.1;}
.card .pr small{font-size:10.5px; color:var(--ink-faint); margin-left:4px; font-weight:700;}
.card .act{padding:9px 11px 11px;}
.card .act .add{width:100%; border:1.5px solid var(--line-strong); background:transparent;
  color:var(--accent); border-radius:999px; padding:8px 8px; font-size:12.5px; font-weight:700;}
@media (min-width:620px){
  .card .body{padding:13px 15px 0; gap:5px;}
  .card .nm{font-size:18.5px;} .card .ds{font-size:12.8px;}
  .card .pr{font-size:21px; padding-top:9px;}
  .card .act{padding:12px 15px 15px;}
  .card .act .add{padding:9px 12px; font-size:13.5px;}
}
.card .act .add{transition:background .16s, color .16s, border-color .16s, transform .13s;}
.card .act .add:hover{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
.card .act .add:active{transform:scale(.94);}
.card .act.pop .qt, .card .act.pop .add{animation:pop .32s cubic-bezier(.3,1.4,.5,1);}
.card .act .qt{display:flex; align-items:center; justify-content:space-between; gap:6px;
  background:var(--accent); border-radius:999px; padding:4px;}
.card .act .qt button{width:31px; height:31px; border:none; border-radius:50%; background:transparent;
  color:var(--accent-ink); font-size:18px; font-weight:700; line-height:1; display:grid; place-items:center;}
.card .act .qt button:hover{background:rgba(255,255,255,.2);}
.card .act .qt b{color:var(--accent-ink); font-size:15px; font-variant-numeric:tabular-nums;}

.cardadmin{display:flex; gap:5px; padding:0 15px 13px; flex-wrap:wrap; align-items:center;}
.cardadmin button{background:transparent; border:1.5px solid var(--line-strong); color:var(--ink-soft);
  border-radius:8px; padding:4px 9px; font-size:11.5px; font-weight:700;}
.cardadmin button:hover{border-color:var(--accent); color:var(--accent);}
.cardadmin .mv{width:30px; padding:0; font-size:13px;}
.cardadmin .del{margin-left:auto; border-color:transparent; color:var(--promo);}

.nada{text-align:center; color:var(--ink-faint); padding:44px 0;}

/* bloque de encargos */
.chip.promo[aria-pressed="true"]{background:var(--promo); border-color:var(--promo); color:#fff;}
.chip.promo{border-color:var(--promo); color:var(--promo);}

.encargo{margin-top:14px; border-radius:15px; background:var(--brownie); color:#F7EFE4;
  padding:13px 15px; display:flex; align-items:center; gap:12px;}
.encargo svg{width:36px; height:36px; flex:none; color:var(--caramel);}
.encargo .tx{flex:1; min-width:0;}
.encargo .et{display:none;}
.encargo h3{font-size:15.5px; margin-bottom:2px; line-height:1.15;}
.encargo p{margin:0; font-size:12.5px; line-height:1.35; opacity:.88;}
.encargo a{flex:none; display:inline-flex; align-items:center; gap:6px; background:var(--caramel);
  color:var(--brownie); border-radius:999px; padding:8px 14px; font-weight:700; font-size:13px;
  text-decoration:none; white-space:nowrap;}
@media (max-width:520px){
  .encargo a{padding:8px 11px; font-size:0;}
  .encargo a::after{content:'→'; font-size:16px;}
}
@media (min-width:760px){
  .encargo{margin-top:18px; border-radius:20px; padding:20px 24px; gap:18px;}
  .encargo svg{width:52px; height:52px;}
  .encargo .et{display:block; font-size:9px; letter-spacing:.22em; text-transform:uppercase;
    font-weight:700; color:var(--caramel); margin-bottom:4px;}
  .encargo h3{font-size:19px; margin-bottom:4px;}
  .encargo p{font-size:14px;}
  .encargo a{padding:10px 18px; font-size:14px;}
}

/* pie */
footer{margin-top:34px; border-top:1px solid var(--line); padding-block:28px 46px; text-align:center;}
footer .ig{display:inline-flex; gap:12px; margin-bottom:16px;}
footer .ig a{display:inline-flex; align-items:center; gap:7px; border:1.5px solid var(--line-strong);
  border-radius:999px; padding:8px 15px; color:var(--ink); text-decoration:none;
  font-size:14px; font-weight:700;}
footer .ig a:hover{border-color:var(--accent); color:var(--accent);}
footer .dir{font-size:15px;}
footer .dir a{color:var(--accent); font-weight:700; text-decoration:none;}
footer .hr{font-size:14px; color:var(--ink-soft); margin-top:5px;}
footer .wa{display:inline-flex; align-items:center; gap:8px; margin-top:17px; background:var(--wa);
  color:#fff; border-radius:999px; padding:11px 21px; font-weight:700; text-decoration:none; font-size:15px;}
footer .cl{margin-top:19px; font-size:9.5px; letter-spacing:.2em; text-transform:uppercase;
  color:var(--ink-faint); font-weight:700;}
footer svg{width:16px; height:16px;}

/* diálogos */
dialog{border:none; border-radius:20px; padding:0; background:var(--surface); color:var(--ink);
  max-width:520px; width:calc(100% - 28px); box-shadow:0 18px 60px rgba(58,28,18,.3);}
dialog::backdrop{background:rgba(42,21,16,.55); backdrop-filter:blur(3px);}
dialog[open]{animation:aparece .26s cubic-bezier(.2,.8,.3,1) both;}
dialog[open]::backdrop{animation:aparece .26s ease both;}
.hero{animation:sube .5s cubic-bezier(.2,.7,.3,1) both;}
.encargo{animation:sube .5s cubic-bezier(.2,.7,.3,1) .06s both;}
.chip{transition:transform .13s, background .16s, color .16s, border-color .16s;}
.chip:active{transform:scale(.93);}
.cat-head h2, .rule{animation:sube .45s cubic-bezier(.2,.7,.3,1) both;}
.ln{transition:opacity .2s;}
.segm button{transition:background .16s, color .16s, border-color .16s, transform .12s;}
.segm button:active{transform:scale(.96);}
.btn.wa{transition:transform .13s, filter .16s;}
.btn.wa:active{transform:scale(.97);}
dialog{max-height:92vh;}
.dlg{padding:18px 17px 18px; position:relative;}
.dlg h3{font-size:19px; margin-bottom:5px; padding-right:38px;}
@media (min-width:620px){ .dlg{padding:24px 24px 22px;} .dlg h3{font-size:21px;} }

/* el detalle del pedido, compacto para que entre en una pantalla */
.dlg.pedido{padding:15px 15px 15px;}
.dlg.pedido h3{font-size:18px; margin-bottom:10px;}
.dlg.pedido .fld{margin-bottom:9px;}
.dlg.pedido .fld span{font-size:9.5px; margin-bottom:3px;}
.dlg.pedido .fld input, .dlg.pedido .fld select, .dlg.pedido .fld textarea{
  padding:8px 11px; font-size:14px; border-radius:9px;}
.dlg.pedido .fld textarea{min-height:42px;}
.dlg.pedido .lineas{max-height:min(30vh, 220px); overflow-y:auto; overscroll-behavior:contain;
  padding-right:7px; scrollbar-width:thin; scrollbar-color:var(--line-strong) transparent;}
.dlg.pedido .lineas::-webkit-scrollbar{width:7px;}
.dlg.pedido .lineas::-webkit-scrollbar-thumb{background:var(--line-strong); border-radius:99px;}
.dlg.pedido .lineas::-webkit-scrollbar-track{background:transparent;}
.dlg.pedido .ln{padding:8px 0;}
.dlg.pedido .ln .nb{font-size:14px;}
.dlg.pedido .total{margin-top:10px; padding-top:9px;}
.dlg.pedido .total b{font-size:23px;}
.dlg.pedido .segm button{padding:8px 6px; font-size:13.5px;}
.dlg.pedido .acciones{margin-top:12px;}
.dlg.pedido .btn{padding:12px 19px;}
.doscol{display:grid; grid-template-columns:1fr 1fr; gap:9px;}
.doscol .fld{margin-bottom:0;}
.cerrarx{position:absolute; right:16px; top:16px; width:34px; height:34px; border-radius:50%;
  border:1.5px solid var(--line-strong); background:var(--surface); color:var(--ink-soft);
  font-size:17px; line-height:1; display:grid; place-items:center; z-index:2;}
.cerrarx:hover{border-color:var(--accent); color:var(--accent);}
.dlg p.sm{font-size:14px; color:var(--ink-soft); margin:0 0 17px;}
.fld{display:block; margin-bottom:13px;}
.fld span{display:block; font-size:10.5px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--ink-faint); font-weight:700; margin-bottom:5px;}
.fld input, .fld textarea, .fld select{width:100%; border:1.5px solid var(--line-strong);
  background:var(--ground); color:var(--ink); border-radius:11px; padding:10px 13px;
  font:inherit; font-size:15px;}
.fld textarea{min-height:66px; resize:vertical;}
.fld.row{display:flex; gap:11px;} .fld.row > label{flex:1;}
.chk{display:flex; align-items:center; gap:9px; font-size:14.5px; margin-bottom:13px; cursor:pointer;}
.chk input{width:18px; height:18px; accent-color:var(--accent);}
.acciones{display:flex; gap:9px; margin-top:19px; flex-wrap:wrap;}
.err{color:var(--promo); font-size:13.5px; font-weight:700; margin-top:9px; min-height:19px;}

/* el pedido */
.lineas{max-height:42vh; overflow-y:auto;}
.ln{display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--line);}
.ln:last-child{border-bottom:none;}
.ln .nb{flex:1; min-width:0; font-size:15px; font-weight:700; line-height:1.25;}
.ln .nb small{display:block; font-weight:400; font-size:12.5px; color:var(--ink-faint);}
.ln .qt{display:flex; align-items:center; gap:3px; border:1.5px solid var(--line-strong);
  border-radius:999px; padding:2px;}
.ln .qt button{width:24px; height:24px; border:none; border-radius:50%; background:transparent;
  color:var(--accent); font-size:16px; font-weight:700; line-height:1;}
.ln .qt b{min-width:18px; text-align:center; font-size:14px;}
.ln .sb{width:76px; text-align:right; font-weight:700; font-variant-numeric:tabular-nums; font-size:14.5px;}
.segm{display:flex; gap:7px; flex-wrap:wrap;}
.segm button{flex:1 1 0; min-width:74px; border:1.5px solid var(--line-strong);
  background:var(--ground); color:var(--ink); border-radius:11px; padding:10px 6px;
  font-size:13.5px; font-weight:700; white-space:nowrap;}
.segm button.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
.ln .rm{width:26px; height:26px; border:none; background:none; color:var(--ink-faint);
  font-size:16px; line-height:1; border-radius:50%; flex:none;}
.ln .rm:hover{background:var(--surface-2); color:var(--promo);}
.total{display:flex; align-items:baseline; justify-content:space-between; margin-top:14px;
  padding-top:13px; border-top:2px solid var(--line-strong);}
.total span{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint); font-weight:700;}
.total b{font-family:'Fraunces',serif; font-size:27px; font-weight:600;}

/* barras pegadas abajo */
.cartbar{position:sticky; bottom:0; z-index:40; background:var(--brownie); color:#F7EFE4;
  padding:12px 0; box-shadow:0 -6px 24px rgba(42,21,16,.22);}
.cartbar.entra{animation:barraSube .34s cubic-bezier(.2,.8,.3,1) both;}
.cartbar .btn{transition:transform .13s, filter .16s;}
.cartbar .btn:active{transform:scale(.95);}
.cartbar.late .qn b{animation:latido .36s ease;}
.cartbar .in{display:flex; gap:12px; align-items:center;}
.cartbar .qn{flex:1; min-width:0;}
.cartbar .qn b{display:block; font-size:14px;}
.cartbar .qn span{font-size:12.5px; opacity:.82;}
.cartbar .btn{background:var(--caramel); color:var(--brownie); padding:11px 17px; font-size:14px;}
.cartbar{padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));}
footer{padding-bottom:calc(46px + env(safe-area-inset-bottom,0px));}
.admbar{position:sticky; bottom:0; z-index:41; background:var(--brownie); color:#F7EFE4; padding:11px 0;}
.admbar .in{display:flex; gap:9px; align-items:center; flex-wrap:wrap;}
.admbar .qn{font-size:13.5px; margin-right:auto; opacity:.9;}
.admbar .btn{padding:9px 16px; font-size:13.5px; min-height:0;}
.admbar .btn.ghost{color:#F7EFE4; border-color:rgba(247,239,228,.4);}

/* visor de fotos */
#lb{position:fixed; inset:0; margin:auto; padding:0; border:none;
  width:min(860px,94vw); max-width:94vw; height:max-content; max-height:92vh;
  background:transparent; box-shadow:none;}
#lb img{width:100%; height:auto; max-height:86vh; object-fit:contain; border-radius:16px; display:block;}
#lb .x{position:absolute; right:10px; top:10px; width:38px; height:38px; border-radius:50%;
  background:rgba(42,21,16,.72); color:#F7EFE4; border:none; font-size:20px;}
#lb img{cursor:pointer;}
#lb .cont{position:absolute; left:50%; bottom:12px; transform:translateX(-50%);
  background:rgba(42,21,16,.72); color:#F7EFE4; border-radius:999px; padding:5px 14px;
  font-size:12.5px; font-weight:700; font-variant-numeric:tabular-nums;}
#lb .cont:empty{display:none;}
#lb .nav{position:absolute; top:50%; transform:translateY(-50%); width:46px; height:46px;
  border-radius:50%; background:rgba(42,21,16,.72); color:#F7EFE4; border:none;
  font-size:28px; line-height:1; display:grid; place-items:center; padding-bottom:4px;
  transition:background .15s, transform .13s;}
#lb .nav:hover{background:rgba(42,21,16,.92);}
#lb .nav:active{transform:translateY(-50%) scale(.92);}
#lb .prev{left:10px;} #lb .next{right:10px;}
#lb.sola .nav, #lb.sola .cont{display:none;}
@media (max-width:520px){ #lb .nav{width:40px; height:40px; font-size:25px;}
  #lb .prev{left:6px;} #lb .next{right:6px;} }
.phcount{position:absolute; right:9px; bottom:9px; z-index:3; background:rgba(58,28,18,.78);
  color:#F7EFE4; border-radius:999px; padding:4px 10px; font-size:11px; font-weight:700;}
</style>

var IG   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"/></svg>';

/* =========================================================================
   4 · CARRITO

function waBase(txt){
  return 'https://wa.me/' + state.brand.whatsapp + '?text='
    + encodeURIComponent(txt || 'Hola! Te escribo desde el menú del café.');
}
function aNumero(p){ var n = String(p||'').replace(/[^\d]/g,''); return n ? parseInt(n,10) : 0; }
function conPuntos(n){ return '$' + n.toLocaleString('es-AR'); }
function itemPorId(id){ return state.items.filter(function(x){ return x.id === id; })[0]; }

/* precio con el descuento ya aplicado, redondeado a los 50 */
function precioFinal(it){
  var v = aNumero(it.price);
  if(it.off > 0) v = Math.round(v * (1 - it.off / 100) / 50) * 50;
  return v;
}
function conDescuento(it){ return it && it.off > 0; }

/* "× 8" se lee mejor como "8 unidades" dentro de la descripción */
function textoSuf(s){
  s = String(s || '').trim();
  if(!s) return '';
  var m = s.match(/^[×x]\s*(\d+)$/i);
  if(m) return m[1] + (m[1] === '1' ? ' unidad' : ' unidades');
  return s;
}

/* un producto puede tener una foto ("photo") o varias ("photos") */
function fotosDe(it){
  if(it.photos && it.photos.length) return it.photos;
  return it.photo ? [it.photo] : [];
}

/* la clave del carrito es "idDelProducto|sabor". Sin sabor queda "id|" */
function opcionesDe(it){ return (it && it.opciones && it.opciones.length > 1) ? it.opciones : null; }
function partirClave(k){
  var i = String(k).indexOf('|');
  return i < 0 ? { id:k, op:'' } : { id:k.slice(0, i), op:k.slice(i + 1) };
}

function lineas(){
  var out = [];
  Object.keys(carrito).forEach(function(k){
    var c = partirClave(k), it = itemPorId(c.id), q = carrito[k];
    if(it && q > 0) out.push({ k:k, it:it, op:c.op, q:q, sub:precioFinal(it) * q });
  });
  return out;
}
function cantidadTotal(){ return lineas().reduce(function(a,l){ return a + l.q; }, 0); }
function totalPesos(){ return lineas().reduce(function(a,l){ return a + l.sub; }, 0); }
function sumar(k, d){
  var q = (carrito[k] || 0) + d;
  if(q <= 0) delete carrito[k]; else carrito[k] = q;
  guardarCarrito();
}
/* cuántas unidades hay de un producto, sumando todos sus sabores */
function enCarrito(id){
  var n = 0;
  Object.keys(carrito).forEach(function(k){ if(partirClave(k).id === id) n += carrito[k]; });
  return n;
}
function ultimaClave(id){
  var ks = Object.keys(carrito).filter(function(k){ return partirClave(k).id === id; });
  return ks.length ? ks[ks.length - 1] : null;
}
function textoPedido(p){
  p = p || {};
  var m = 'Hola! Te hago un pedido desde el menú:\n\n';
  lineas().forEach(function(l){
    var ex = [l.op, textoSuf(l.it.suf)].filter(Boolean).join(', ');
    m += '• ' + l.q + ' × ' + l.it.name + (ex ? ' (' + ex + ')' : '')
       + ' — ' + conPuntos(l.sub) + '\n';
  });
  m += '\nTotal estimado: ' + conPuntos(totalPesos()) + '\n';
  m += '\nEntrega: ' + (p.entrega === 'envio' ? 'Envío a domicilio' : 'Retiro en el local');
  if(p.entrega === 'envio' && p.dir) m += '\nDirección: ' + p.dir;
  if(p.pago) m += '\nPago: ' + p.pago;
  if(p.nota) m += '\n\nAclaraciones: ' + p.nota;
  return m;
}

/* =========================================================================
   4c · FOTOS EXTRA AUTOMÁTICAS
   Si un producto tiene "Chipa.jpeg", la página busca sola "Chipa 2.jpeg",
   "Chipa 3.jpeg"… y también "Chipa (2).jpeg", que es como numera Windows.
   ========================================================================= */
function baseDeFoto(u){
  var m = String(u).match(/^(.*?)(\.[a-z0-9]+)$/i);
  if(!m) return null;
  return { base: m[1].replace(/(?:%20|\s)*(?:\(\d+\)|\d+)$/, ''), ext: m[2] };
}
function probarFoto(url, cb){
  var i = new Image();
  i.onload  = function(){ cb(true); };
  i.onerror = function(){ cb(false); };
  i.src = url;
}
/* el nombre del archivo puede estar en minúscula o sin tildes */
function sinTildes(s){
  return String(s).normalize ? String(s).normalize('NFD').replace(/[̀-ͯ]/g, '') : String(s);
}
function variantesNombre(n){
  var a = [n, n.toLowerCase(), sinTildes(n), sinTildes(n).toLowerCase()];
  return a.filter(function(v, i){ return a.indexOf(v) === i; });
}

function autoFotos(listo){
  var pend = 0, hubo = false;
  var CARPETA = 'fotos-cafe/';

  (state.items || []).forEach(function(it){
    pend++;
    var conf = fotosDe(it), antes = conf.join('|'), lista = [];

    var terminar = function(){
      it.photos = lista;
      it.photo = '';
      if(lista.join('|') !== antes) hubo = true;
      if(--pend === 0 && hubo) listo();
    };

    /* a partir de la primera, busca "nombre 2", "nombre (3)"… */
    var extender = function(){
      var b = baseDeFoto(lista[0]);
      if(!b){ terminar(); return; }
      (function siguiente(n){
        if(n > 9){ terminar(); return; }
        var cands = [ b.base + '%20' + n + b.ext, b.base + '%20(' + n + ')' + b.ext ], k = 0;
        (function probar(){
          if(k >= cands.length){ terminar(); return; }
          var u = cands[k++];
          probarFoto(u, function(ok){
            if(ok){ if(lista.indexOf(u) === -1) lista.push(u); siguiente(n + 1); }
            else probar();
          });
        })();
      })(2);
    };

    /* 1 · comprobamos que las cargadas a mano sigan existiendo */
    var i = 0;
    (function verificar(){
      if(i < conf.length){
        var u = conf[i++];
        probarFoto(u, function(ok){ if(ok) lista.push(u); verificar(); });
        return;
      }
      if(lista.length){ extender(); return; }

      /* 2 · si no quedó ninguna, buscamos por el nombre del producto */
      var exts = ['.jpeg', '.jpg', '.png'], cands = [];
      variantesNombre(it.name).forEach(function(v){
        exts.forEach(function(e){ cands.push(CARPETA + encodeURIComponent(v) + e); });
      });
      var k = 0;
      (function porNombre(){
        if(k >= cands.length){ terminar(); return; }
        var u = cands[k++];
        probarFoto(u, function(ok){
          if(ok){ lista.push(u); extender(); } else porNombre();
        });
      })();
    })();
  });
}

/* =========================================================================
   5 · RENDER
   ========================================================================= */
function coincide(it){
  if(!filtro) return true;
  return (it.name + ' ' + (it.desc||'') + ' ' + it.price).toLowerCase().indexOf(filtro) !== -1;
}
function visibles(secId, isAdm){
  return state.items.filter(function(it){
    return it.sec === secId && (it.activo || isAdm) && coincide(it);
  });
}
function enPromo(isAdm){
  return state.items.filter(function(it){
    return conDescuento(it) && (it.activo || isAdm) && coincide(it);
  });
}

function tarjeta(it, sc, isAdm, i){
  var q = enCarrito(it.id);
  var off = conDescuento(it);
  var h = '<div class="card' + (it.activo ? '' : ' off') + (off ? ' conoff' : '')
        + '" style="--i:' + (i || 0) + '">';

  var fs = fotosDe(it);
  h += '<div class="ph' + (fs.length ? ' clic" data-fotos="' + esc(it.id) + '' : '') + '">'
    + '<div class="mark">' + svg(D[sc.icono] || D.cupcake) + '</div>'
    + (fs.length
        ? '<img src="' + esc(fs[0]) + '" alt="' + esc(it.name) + '" loading="lazy" onerror="this.remove()">'
        : '<div class="falta">Falta la foto</div>')
    + (fs.length > 1 ? '<span class="phcount">' + fs.length + ' fotos</span>' : '')
    + (it.destacado ? '<span class="tagtop">Lo más pedido</span>' : '')
    + (off ? '<span class="offtag">−' + it.off + '%</span>' : '')
    + '</div>';

  /* precio: con descuento, o con el "antes" de los combos */
  var pr;
  if(off) pr = '<span class="antes">' + esc(it.price) + '</span>' + conPuntos(precioFinal(it));
  else if(it.antes) pr = '<span class="antes">' + esc(it.antes) + '</span>' + esc(it.price);
  else pr = esc(it.price);

  var uni = textoSuf(it.suf);
  h += '<div class="body"><div class="nm">' + esc(it.name) + '</div>'
    + (uni || it.desc
        ? '<div class="ds">' + (uni ? '<b>' + esc(uni) + '</b>' + (it.desc ? ' · ' : '') : '')
          + esc(it.desc || '') + '</div>'
        : '')
    + '<div class="pr">' + pr + '</div></div>';

  if(isAdm){
    h += '<div class="cardadmin">'
      + '<button data-edit="' + esc(it.id) + '">editar</button>'
      + '<button class="mv" data-sube="' + esc(it.id) + '">↑</button>'
      + '<button class="mv" data-baja="' + esc(it.id) + '">↓</button>'
      + '<button class="del" data-borra="' + esc(it.id) + '">borrar</button></div>';
  } else {
    h += '<div class="act' + (tocado === it.id ? ' pop' : '') + '">' + (q > 0
      ? '<div class="qt"><button data-menos="' + esc(it.id) + '" aria-label="Quitar uno">−</button>'
        + '<b>' + q + '</b>'
        + '<button data-mas="' + esc(it.id) + '" aria-label="Agregar uno">+</button></div>'
      : '<button class="add" data-mas="' + esc(it.id) + '">+ Agregar</button>') + '</div>';
  }
  return h + '</div>';
}

function render(){
  var sy = window.scrollY;
  var b = state.brand, s = state.settings, isAdm = !!admin.token;
  var h = '';

  document.getElementById('bg').innerHTML =
    ['b1','b2','b3','b4','b5','b6'].map(function(c){
      return '<span class="' + c + '">' + svg(D.taza) + '</span>'; }).join('');

  /* --- encabezado --- */
  h += '<header class="top"><div class="wrap top-in">'
    + '<div class="brand"><span class="nm">' + esc(b.name) + '</span>'
    + '<span class="sub">' + esc(b.sub) + '</span></div>'
    + '<a class="btn wa sm top-wa" target="_blank" rel="noopener" href="' + esc(waBase()) + '">'
    + WAI + 'Escribinos</a>'
    + '<button class="adm-btn' + (isAdm ? ' on' : '') + '" data-adm aria-label="Administración">'
    + LOCK + '</button></div></header>';

  h += '<div class="wrap">';

  /* --- encargos, arriba de todo --- */
  h += '<div class="encargo">' + svg(D.pisos)
    + '<div class="tx"><div class="et">¿Festejás algo?</div>'
    + '<h3>Tortas y mesas dulces por encargo</h3>'
    + '<p>Desde una mini para dos hasta una mesa para cuarenta y cinco.</p></div>'
    + '<a href="' + esc(s.catalogoUrl || '#') + '">Ver el catálogo</a></div>';

  /* --- hero --- */
  h += '<div class="hero"><div class="eyebrow">El menú del café</div>'
    + '<h1>' + esc(s.titulo) + '</h1>'
    + '<p class="lead">' + esc(s.bajada) + '</p></div>';

  /* --- anuncios --- */
  var an = (state.anuncios || []).filter(function(a){ return a.activo || isAdm; });
  if(an.length || isAdm){
    h += '<div class="anuncios">';
    an.forEach(function(a){
      h += '<div class="anuncio"' + (a.activo ? '' : ' style="opacity:.5"') + '>'
        + '<span class="dot"></span><span>' + esc(a.texto) + '</span>'
        + (isAdm ? '<button class="ax" data-anedit="' + esc(a.id) + '">editar</button>' : '') + '</div>';
    });
    if(isAdm) h += '<div class="anuncio" style="border-left-color:var(--line)">'
      + '<span class="dot" style="background:var(--line-strong)"></span>'
      + '<span style="color:var(--ink-faint)">Agregar un aviso corto del día</span>'
      + '<button class="ax" data-anedit="nuevo">agregar</button></div>';
    h += '</div>';
  }

  /* --- chips de categorías (se usan arriba en celular y al costado en compu) --- */
  var nPromo = enPromo(isAdm).length;
  function chips(){
    var t = '<button class="chip" data-cat="" aria-pressed="' + (catSel === null) + '">Todo</button>';
    if(nPromo) t += '<button class="chip promo" data-cat="promo" aria-pressed="'
      + (catSel === 'promo') + '">Con descuento<span class="n">' + nPromo + '</span></button>';
    state.secciones.forEach(function(sc){
      var n = visibles(sc.id, isAdm).length;
      t += '<button class="chip" data-cat="' + esc(sc.id) + '" aria-pressed="'
        + (catSel === sc.id) + '">' + esc(sc.name) + '<span class="n">' + n + '</span></button>';
    });
    return t;
  }

  function buscador(donde){
    return '<div class="buscador">' + LUPA + '<input type="search" class="qi" data-q="' + donde
      + '" placeholder="Buscar…" value="' + esc(filtro) + '"></div>';
  }

  h += '<div class="cinta">' + buscador('top')
    + '<div class="chips">' + chips() + '</div></div>';

  h += '<div class="layout">';

  /* --- panel al costado --- */
  h += '<aside class="side">'
    + '<div class="sblock">' + buscador('side') + '</div>'
    + '<div class="sblock"><h3><span class="step">1</span>Qué buscás</h3>'
    + '<div class="chips" style="flex-direction:column;align-items:stretch">' + chips() + '</div></div>'
    + '</aside>';

  if(!hayAlgo){
    h += '<p class="nada">' + (filtro
      ? 'No encontramos nada con «' + esc(filtro) + '».'
      : 'No hay productos en esta categoría.') + '</p>';

  h += '</main></div>';   /* cierra main y layout */

  /* --- pie --- */
  h += '<footer>'
    + '<div class="ig"><a href="https://instagram.com/' + esc(b.instagram) + '" target="_blank" rel="noopener">'
    + IG + '@' + esc(b.instagram) + '</a></div>'
    + '<div class="dir">' + PIN.replace('<svg', '<svg style="width:15px;height:15px;vertical-align:-2px;margin-right:4px;color:var(--accent)"')
    + '<a href="' + esc(b.maps) + '" target="_blank" rel="noopener">' + esc(b.address) + '</a></div>'
    + '<div class="hr">' + esc(b.hours) + '</div>'
    + '<a class="wa" href="' + esc(waBase()) + '" target="_blank" rel="noopener">' + WAI + 'Escribinos</a>'
    + '<div class="cl">' + esc(b.claim) + '</div></footer>';

  h += '</div>';   /* cierra .wrap */

  /* --- barras de abajo --- */
  var nq = cantidadTotal();
  if(nq > 0 && !isAdm){
    h += '<div class="cartbar' + (barraVisible ? (tocado ? ' late' : '') : ' entra') + '">'
      + '<div class="wrap in">'
      + '<div class="qn"><b>' + nq + (nq === 1 ? ' producto' : ' productos') + '</b>'
      + '<span>Total estimado ' + conPuntos(totalPesos()) + '</span></div>'
      + '<button class="btn" data-verpedido>Ver el pedido</button></div></div>';
  }
  if(isAdm){
    h += '<div class="admbar"><div class="wrap in">'
      + '<span class="qn">' + esc(admin.email)
      + (admin.dirty ? ' · hay cambios sin guardar' : ' · todo guardado') + '</span>'
      + '<button class="btn ghost" data-ajustes>Datos del local</button>'
      + '<button class="btn ghost" data-salir>Salir</button>'
      + '<button class="btn" data-guardar>Guardar cambios</button></div></div>';
  }

  document.getElementById('app').innerHTML = h;
  if(sy) window.scrollTo(0, sy);

  /* las animaciones de entrada corren una sola vez por cambio de vista */
  animEntrada = false;
  tocado = null;
  barraVisible = (nq > 0 && !isAdm);

  medirEncabezado();
  animarTotal();
}

var sinMovimiento = window.matchMedia
  && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* --- el encabezado achicándose --- */
function medirEncabezado(){
  var h = document.querySelector('header.top');
  if(h) document.documentElement.style.setProperty('--htop', h.offsetHeight + 'px');
}
var ticking = false;
window.addEventListener('scroll', function(){
  if(ticking) return;
  ticking = true;
  requestAnimationFrame(function(){
    document.body.classList.toggle('compacto', window.scrollY > 70);
    medirEncabezado();
    ticking = false;
  });
}, { passive:true });
window.addEventListener('resize', medirEncabezado);

/* --- el total contando --- */
var totalMostrado = totalPesos();
function animarTotal(){
  var el = document.querySelector('.cartbar .qn span');
  var hasta = totalPesos();
  if(!el){ totalMostrado = hasta; return; }
  var desde = totalMostrado;
  if(desde === hasta || sinMovimiento){
    el.textContent = 'Total estimado ' + conPuntos(hasta);
    totalMostrado = hasta; return;
  }
  var t0 = performance.now(), dur = 520;
  (function paso(t){
    var k = Math.min(1, (t - t0) / dur);
    var e = 1 - Math.pow(1 - k, 3);
    var v = Math.round((desde + (hasta - desde) * e) / 10) * 10;
    el.textContent = 'Total estimado ' + conPuntos(k < 1 ? v : hasta);
    if(k < 1) requestAnimationFrame(paso); else totalMostrado = hasta;
  })(t0);
}

var BOLSA =
  '<svg viewBox="0 0 100 116" xmlns="http://www.w3.org/2000/svg">'
  /* lateral, el lado en sombra */
  + '<path d="M74 34 L90 24 L90 94 L74 104 Z" fill="#9C6838"/>'
  /* frente */
  + '<path d="M10 34 H74 V104 H10 Z" fill="#C08552"/>'
  /* solapa de arriba, doblada */
  + '<path d="M10 34 H74 L90 24 H26 Z" fill="#D8A876"/>'
  + '<path d="M26 24 L10 34" stroke="#9C6838" stroke-width="1.4" fill="none"/>'
  /* pliegues del frente */
  + '<path d="M20 34 V104 M64 34 V104" stroke="#AD7445" stroke-width="1" opacity=".45" fill="none"/>'
  /* base */
  + '<path d="M10 104 H74 L90 94" stroke="#8C5A2F" stroke-width="1.4" fill="none"/>'
  /* el logo, bien grande para que se lea */
  + '<text x="42" y="78" text-anchor="middle" fill="#4A2419" '
  + 'font-family="Fraunces, Georgia, serif" font-size="27" font-weight="600">Cake</text>'
  + '<path d="M28 88 H56" stroke="#4A2419" stroke-width="1.8" stroke-linecap="round" opacity=".7"/>'
  + '</svg>';

function agregarAlCarrito(clave, card){
  var vuelo = rectDeTarjeta(card);
  tocado = partirClave(clave).id;
  sumar(clave, 1);
  if(dlg.open && dd.classList.contains('pedido')) dlgPedido(datosPedido());
  render();
  volarAlCarrito(vuelo);
  if(navigator.vibrate) try{ navigator.vibrate(12); }catch(x){}
}

function rectDeTarjeta(card){
  if(!card) return null;
  var ph = card.querySelector('.ph') || card;
  return ph.getBoundingClientRect();
}

function volarAlCarrito(r){
  if(!r || sinMovimiento || !r.width) return;
  var ancho = Math.min(r.width * .78, 108);
  var alto  = ancho * 1.16;
  var x0 = r.left + r.width / 2 - ancho / 2;
  var y0 = r.top  + r.height / 2 - alto / 2;

  var el = document.createElement('div');
  el.className = 'volador';
  el.innerHTML = BOLSA;
  el.style.left   = x0 + 'px';
  el.style.top    = y0 + 'px';
  el.style.width  = ancho + 'px';
  el.style.height = alto + 'px';
  document.body.appendChild(el);

  requestAnimationFrame(function(){
    var dest = document.querySelector('.cartbar .btn');
    var dr = dest ? dest.getBoundingClientRect()
                  : { left: window.innerWidth - 100, top: window.innerHeight - 56, width:70, height:42 };
    var dx = (dr.left + dr.width / 2)  - (x0 + ancho / 2);
    var dy = (dr.top  + dr.height / 2) - (y0 + alto / 2);

    var fin = function(){ if(el.parentNode) el.remove(); };
    if(!el.animate){ fin(); return; }
    el.animate([
      /* aparece */
      { transform:'translate(0,0) scale(.35) rotate(-8deg)', opacity:0, offset:0 },
      { transform:'translate(0,-10px) scale(1.12) rotate(3deg)', opacity:1, offset:.12 },
      { transform:'translate(0,-14px) scale(1) rotate(0deg)', opacity:1, offset:.2 },
      /* se queda un momento para que se lea "Cake" */
      { transform:'translate(0,-16px) scale(1) rotate(-2deg)', opacity:1, offset:.42 },
      /* recién ahí se va volando */
      { transform:'translate(' + (dx * .3) + 'px,' + (dy * .2 - 60) + 'px) scale(.88) rotate(5deg)',
        opacity:1, offset:.64 },
      { transform:'translate(' + (dx * .72) + 'px,' + (dy * .6 - 40) + 'px) scale(.6) rotate(-4deg)',
        opacity:.95, offset:.85 },
      { transform:'translate(' + dx + 'px,' + dy + 'px) scale(.18) rotate(10deg)', opacity:0, offset:1 }
    ], { duration:1650, easing:'cubic-bezier(.32,.05,.3,1)' }).onfinish = fin;
    setTimeout(fin, 2100);
  });
}

function guardar(){
  if(!admin.token) return;
  if(location.protocol === 'file:'){
    alert('Para guardar, la página tiene que estar publicada en internet.'); return;
  }
  fetch(DB_BASE + DB_NODE + '?auth=' + encodeURIComponent(admin.token), {
    method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(state)
  }).then(function(r){
    if(r.ok){ admin.dirty = false; render(); alert('Guardado.'); }
    else if(r.status === 401 || r.status === 403){
      alert('La sesión venció. Entrá de nuevo.');
      admin.token = null; try{ sessionStorage.removeItem('cake-cafe-adm'); }catch(e){} render();
    } else alert('No se pudo guardar.');
  }).catch(function(){ alert('No hay conexión con la base.'); });
}

function mover(id, dir){
  var i = -1;
  state.items.forEach(function(x, k){ if(x.id === id) i = k; });
  if(i < 0) return;
  var mismos = [];
  state.items.forEach(function(x, k){ if(x.sec === state.items[i].sec) mismos.push(k); });
  var pos = mismos.indexOf(i), dest = mismos[pos + dir];
  if(dest === undefined) return;
  var tmp = state.items[i]; state.items[i] = state.items[dest]; state.items[dest] = tmp;
  admin.dirty = true; render();
}

/* =========================================================================
   8 · EVENTOS
   ========================================================================= */
var lb = document.getElementById('lb'), lbi = document.getElementById('lb-i');
var lbLista = [], lbIx = 0;

function lbPintar(){
  lbi.src = lbLista[lbIx];
  lb.querySelector('.cont').textContent =
    lbLista.length > 1 ? (lbIx + 1) + ' / ' + lbLista.length : '';
}
function lbMover(d){
  if(lbLista.length < 2) return;
  lbIx = (lbIx + d + lbLista.length) % lbLista.length;
  lbPintar();
}

/* flechas del teclado */
document.addEventListener('keydown', function(e){
  if(!lb.open) return;
  if(e.key === 'ArrowRight') lbMover(1);
  if(e.key === 'ArrowLeft')  lbMover(-1);
});

/* deslizar con el dedo */
(function(){
  var x0 = null;
  lb.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; }, { passive:true });
  lb.addEventListener('touchend', function(e){
    if(x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0;
    if(Math.abs(dx) > 45) lbMover(dx < 0 ? 1 : -1);
    x0 = null;
  }, { passive:true });
})();

document.addEventListener('click', function(e){
  var t = e.target, b;
  if(t.closest('[data-cerrar]')) { cerrar(); return; }

  /* carrito */
  /* agregar desde la tarjeta: si tiene sabores, primero se elige */
  if((b = t.closest('[data-mas]'))){
    var it0 = itemPorId(b.dataset.mas);
    var card0 = b.closest('.card');
    if(opcionesDe(it0)){ dlgSabor(it0, card0); return; }
    agregarAlCarrito(it0.id + '|', card0);
    return;
  }
  /* elegido el sabor */
  if((b = t.closest('[data-elige]'))){
    if(!elegirPend) return;
    var pend = elegirPend; elegirPend = null; cerrar();
    agregarAlCarrito(pend.id + '|' + b.dataset.elige, pend.card);
    return;
  }
  /* quitar desde la tarjeta: saca el último sabor agregado */
  if((b = t.closest('[data-menos]'))){
    var k0 = ultimaClave(b.dataset.menos);
    if(!k0) return;
    tocado = b.dataset.menos;
    sumar(k0, -1);
    render(); return;
  }
  /* más y menos dentro del detalle del pedido, sobre un sabor puntual */
  if((b = t.closest('[data-masq]'))){
    tocado = partirClave(b.dataset.masq).id;
    sumar(b.dataset.masq, 1);
    if(dlg.open) dlgPedido(datosPedido());
    render(); return;
  }
  if((b = t.closest('[data-menosq]'))){
    tocado = partirClave(b.dataset.menosq).id;
    sumar(b.dataset.menosq, -1);
    if(dlg.open){
      var d2 = datosPedido();
      if(cantidadTotal() > 0) dlgPedido(d2); else cerrar();
    }
    render(); return;
  }
  if(t.closest('[data-verpedido]')){ dlgPedido({}); return; }

  /* medio de pago */
  if((b = t.closest('[data-pago]'))){
    var dp = datosPedido();
    dp.pago = b.dataset.pago;
    dlgPedido(dp);
    return;
  }

  /* retiro / envío: redibuja el detalle para mostrar u ocultar la dirección */
  if((b = t.closest('[data-entrega]'))){
    var de = datosPedido();
    de.entrega = b.dataset.entrega;
    dlgPedido(de);
    if(de.entrega === 'envio'){
      var di = dd.querySelector('#p-dir');
      if(di) di.focus();
    }
    return;
  }
  if((b = t.closest('[data-quita]'))){
    var d3 = datosPedido();
    delete carrito[b.dataset.quita]; guardarCarrito();
    if(cantidadTotal() > 0) dlgPedido(d3); else cerrar();
    render(); return;
  }

  /* categorías */
  if((b = t.closest('[data-cat]'))){
    catSel = b.dataset.cat || null;
    animEntrada = true;
    render(); return;
  }

  /* foto ampliada */
  if((b = t.closest('[data-fotos]'))){
    lbLista = fotosDe(itemPorId(b.dataset.fotos)); lbIx = 0;
    if(!lbLista.length) return;
    lb.classList.toggle('sola', lbLista.length < 2);
    lbPintar();
    lb.showModal(); return;
  }
  if((b = t.closest('[data-lb]'))){ lbMover(Number(b.dataset.lb)); return; }
  if(t === lbi){ lbMover(1); return; }

  /* administración */
  if(t.closest('[data-adm]'))    { admin.token ? dlgAjustes() : dlgLogin(); return; }
  if(t.closest('[data-salir]'))  {
    if(admin.dirty && !confirm('Hay cambios sin guardar. ¿Salir igual?')) return;
    admin.token = null; admin.email = null; admin.dirty = false;
    try{ sessionStorage.removeItem('cake-cafe-adm'); }catch(x){}
    render(); return;
  }
  if(t.closest('[data-guardar]')){ guardar(); return; }
  if(t.closest('[data-ajustes]')){ dlgAjustes(); return; }
  if((b = t.closest('[data-edit]')))   { dlgItem(b.dataset.edit); return; }
  if((b = t.closest('[data-add]')))    { dlgItem(null, b.dataset.add); return; }
  if((b = t.closest('[data-borra]')))  {
    var it = itemPorId(b.dataset.borra);
    if(it && confirm('¿Borrar «' + it.name + '»?')){
      state.items = state.items.filter(function(x){ return x.id !== it.id; });
      admin.dirty = true; render();
    } return;
  }
  if((b = t.closest('[data-sube]')))   { mover(b.dataset.sube, -1); return; }
  if((b = t.closest('[data-baja]')))   { mover(b.dataset.baja,  1); return; }
  if((b = t.closest('[data-anedit]'))) { dlgAnuncio(b.dataset.anedit); return; }
});

document.addEventListener('input', function(e){
  if(e.target.classList && e.target.classList.contains('qi')){
    filtro = e.target.value.trim().toLowerCase();
    var donde = e.target.dataset.q, pos = e.target.selectionStart;
    animEntrada = true;
    render();
    var n = document.querySelector('.qi[data-q="' + donde + '"]');
    if(n){ n.focus(); try{ n.setSelectionRange(pos, pos); }catch(x){} }
  }
});

window.addEventListener('beforeunload', function(e){
  if(admin.dirty){ e.preventDefault(); e.returnValue = ''; }
});

/* =========================================================================
   9 · ARRANQUE
   ========================================================================= */
/* el botón de administración aparece solo con #admin en la dirección,
   o si ya hay una sesión abierta */
function chequearAdmin(){
  var on = location.hash === '#admin' || !!admin.token;
  document.body.classList.toggle('modoadmin', on);
  return on;
}
window.addEventListener('hashchange', function(){
  if(chequearAdmin() && !admin.token) dlgLogin();
});

render();
autoFotos(function(){ render(); });
if(chequearAdmin() && !admin.token) dlgLogin();

if(USAR_BASE){
  fetch(DB_BASE + DB_NODE, { cache:'no-store' })
    .then(function(r){ return r.json(); })
    .then(function(j){ if(j && j.items && j.items.length){ state = j; render(); } })
    .catch(function(){ /* sin conexión: queda el menú escrito en este archivo */ });
}

})();
