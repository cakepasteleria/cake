<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Cake Pastelería Creativa</title>
<meta name="description" content="Tortas, postres y mesas dulces por encargo en Corrientes. Cake, café y pastelería creativa. Córdoba 417.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ===========================================================
   CAKE · Catálogo + panel de administración
   Paleta: Cream #F3E9DC · Caramel #C08552 · Coffee #895737 · Brownie #5E3023
   =========================================================== */
:root{
  --ground:#F3E9DC; --surface:#FFFBF4; --surface-2:#E9DAC5;
  --ink:#3A1C12; --ink-soft:#7A4B30; --ink-faint:#9C7452;
  --accent:#895737; --accent-ink:#FFFBF4; --accent-soft:#E9DAC5;
  --caramel:#C08552; --brownie:#5E3023;
  --line:#DCC7AC; --line-strong:#C2A47F;
  --draw:#C08552; --wa:#1F7A3D; --promo:#A34426;
  --shadow:0 1px 2px rgba(58,28,18,.06), 0 12px 32px -18px rgba(58,28,18,.40);
  --radius:18px;
}
/* La página va siempre con los colores de la marca, sin modo oscuro
   automático: la crema y el marrón son parte de la identidad. */
:root{ color-scheme: light; }

*{box-sizing:border-box;}
html,body{margin:0;}
body{background:var(--ground); color:var(--ink);
  -webkit-text-size-adjust:100%; text-size-adjust:100%;
  font-family:'Karla', ui-sans-serif, system-ui, sans-serif; font-size:16px; line-height:1.55;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;}
.wrap{max-width:1140px; margin:0 auto; padding-inline:16px; padding-block:0;}
h1,h2,h3{font-family:'Fraunces', Georgia, serif; margin:0; text-wrap:balance; font-weight:600;}
a{color:inherit;} img{max-width:100%; display:block;}
/* Safari en iPhone le pone su propio azul a los botones si no se lo aclarás */
button{font:inherit; cursor:pointer; color:inherit; -webkit-appearance:none; appearance:none;}
a{-webkit-text-decoration-skip:objects;}
:focus-visible{outline:2.5px solid var(--accent); outline-offset:2px; border-radius:6px;}
.tnum{font-variant-numeric:tabular-nums;}
s{text-decoration-thickness:1.5px;}
[hidden]{display:none !important;}
.hint{font-size:13px; color:var(--ink-faint); margin:0;}

/* fondo ilustrado */
#bg{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;}
#bg svg{position:absolute; color:var(--draw); opacity:.17;}
#bg .b1{width:150px; top:1%;  left:-38px;}  #bg .b2{width:108px; top:12%; right:-26px;}
#bg .b3{width:126px; top:24%; left:-30px;}  #bg .b4{width:98px;  top:36%; right:-20px;}
#bg .b5{width:138px; top:48%; left:-34px;}  #bg .b6{width:102px; top:60%; right:-22px;}
#bg .b7{width:122px; top:72%; left:-30px;}  #bg .b8{width:100px; top:84%; right:-22px;}
#bg .b9{width:132px; top:94%; left:-32px;}
#bg .b10{width:88px;  top:6%;  right:8%;  opacity:.10; display:none;}
#bg .b11{width:104px; top:20%; left:7%;   opacity:.10; display:none;}
#bg .b12{width:82px;  top:33%; right:10%; opacity:.10; display:none;}
#bg .b13{width:112px; top:46%; left:6%;   opacity:.10; display:none;}
#bg .b14{width:86px;  top:58%; right:7%;  opacity:.10; display:none;}
#bg .b15{width:100px; top:70%; left:9%;   opacity:.10; display:none;}
#bg .b16{width:92px;  top:82%; right:9%;  opacity:.10; display:none;}
#bg .b17{width:108px; top:92%; left:7%;   opacity:.10; display:none;}
@media (min-width:900px){
  #bg .b10,#bg .b11,#bg .b12,#bg .b13,#bg .b14,#bg .b15,#bg .b16,#bg .b17{display:block;}
  #bg .b1{width:190px;} #bg .b3{width:168px;} #bg .b5{width:180px;} #bg .b7{width:160px;}
  #bg .b9{width:172px;} #bg .b2{width:145px;} #bg .b4{width:132px;} #bg .b6{width:138px;}
  #bg .b8{width:134px;} }
#veil{position:fixed; inset:0; z-index:1; pointer-events:none;
  background:radial-gradient(120% 70% at 50% 0%, transparent 42%, var(--ground) 100%);}
#app{position:relative; z-index:2;}

/* encabezado */
header.top{background:color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line); position:sticky; top:env(safe-area-inset-top,0px); z-index:30;}
.top-in{display:flex; align-items:center; gap:10px; padding-block:10px;
  transition:padding-block .22s ease;}

/* al bajar, el encabezado se achica y devuelve pantalla */
body.compacto .top-in{padding-block:5px;}
body.compacto .logo-slot{width:36px; height:36px;}
body.compacto .brand .nm{font-size:21px;}
body.compacto .brand .sub{opacity:0; max-height:0; margin-top:0;}
.logo-slot{transition:width .22s ease, height .22s ease;}
.brand .nm{transition:font-size .22s ease;}
.brand .sub{transition:opacity .18s ease, max-height .22s ease, margin-top .22s ease;
  max-height:16px; overflow:hidden;}
@media (min-width:900px){
  body.compacto .logo-slot{width:44px; height:44px;}
  body.compacto .brand .nm{font-size:23px;}
}

/* confeti */
#confeti{position:fixed; inset:0; z-index:95; pointer-events:none;}

/* ---------- hoja para exportar a PDF ---------- */
#imprimible{display:none;}
body.imprimiendo #app, body.imprimiendo #bg, body.imprimiendo #veil{display:none !important;}
body.imprimiendo #imprimible{display:block; max-width:840px; margin:0 auto; padding:26px;
  background-repeat:repeat; background-size:300px 300px; background-position:center top;
  -webkit-print-color-adjust:exact; print-color-adjust:exact;}
.pdf-h{text-align:center; padding-bottom:16px; border-bottom:2.5px solid var(--line-strong);}
.pdf-m{font-family:'Fraunces',serif; font-size:54px; font-weight:600; line-height:1; color:var(--brownie);}
.pdf-s{font-size:11px; letter-spacing:.3em; text-transform:uppercase; color:var(--ink-soft);
  font-weight:700; margin-top:8px;}
.pdf-t{font-family:'Fraunces',serif; font-size:36px; font-weight:600; margin:24px 0 3px; color:var(--ink);}
.pdf-n{font-size:15px; color:var(--ink-soft); margin:0 0 18px; font-style:italic;}
.pdf-grid{display:grid; gap:14px;}
.pdf-i{display:flex; gap:18px; border:1.5px solid var(--line); border-radius:14px;
  padding:16px; break-inside:avoid; page-break-inside:avoid; background:var(--surface);}
.pdf-i img{width:160px; height:160px; object-fit:cover; border-radius:11px; flex:none;}
.pdf-sf{width:160px; height:160px; border-radius:11px; flex:none; background:var(--surface-2);}
.pdf-b{flex:1; min-width:0;}
.pdf-nm{font-family:'Fraunces',serif; font-size:26px; font-weight:600; line-height:1.14;}
.pdf-p{display:inline-block; font-size:13px; font-weight:700; background:var(--accent-soft);
  color:var(--accent); border-radius:999px; padding:4px 12px; margin-top:7px;}
.pdf-d{font-size:15px; color:var(--ink-soft); margin-top:7px; line-height:1.45;}
.pdf-l{margin:8px 0 0; padding-left:18px; font-size:14px; color:var(--ink-soft); line-height:1.55;
  columns:2; column-gap:18px;}
.pdf-pr{margin-top:11px; font-size:26px; font-weight:700; color:var(--accent); letter-spacing:-.02em;}
.pdf-pr small{font-size:13px; color:var(--ink-faint); font-weight:700; letter-spacing:.07em;
  text-transform:uppercase; margin-right:5px;}

/* pie completo, como el de la página */
.pdf-info{margin-top:26px; border:1.5px solid var(--line); border-radius:16px; padding:20px 22px;
  display:grid; grid-template-columns:repeat(3,1fr); gap:22px; break-inside:avoid;
  page-break-inside:avoid; background:var(--surface);}
.pdf-info h4{font-family:'Karla',sans-serif; font-size:11px; letter-spacing:.15em;
  text-transform:uppercase; color:var(--accent); font-weight:700; margin:0 0 9px;}
.pdf-info ul{margin:0; padding-left:16px; font-size:13.5px; color:var(--ink-soft); line-height:1.7;}
.pdf-info p{margin:0; font-size:13.5px; color:var(--ink-soft); line-height:1.5;}
.pdf-plan{margin-top:12px; border-left:3px solid var(--caramel); padding-left:11px;}
.pdf-plan b{display:block; font-family:'Fraunces',serif; font-size:17px; color:var(--ink);}
.pdf-plan span{display:block; font-size:12.5px; color:var(--ink-soft); line-height:1.45; margin-top:3px;}
.pdf-f{margin-top:22px; padding-top:18px; border-top:1.5px solid var(--line);
  text-align:center; color:var(--ink-soft); line-height:1.7; break-inside:avoid;}
.pdf-f .fm{font-family:'Fraunces',serif; font-size:34px; font-weight:600; color:var(--brownie); line-height:1;}
.pdf-f .fs{font-size:10px; letter-spacing:.3em; text-transform:uppercase; font-weight:700; margin:7px 0 12px;}
.pdf-f .fd{font-size:14px; color:var(--ink); font-weight:700;}
.pdf-f .fh{font-size:13.5px;}
.pdf-f .fi{font-size:14px; margin-top:8px; color:var(--accent); font-weight:700;}

/* botones de exportar */
.cat-top{display:flex; align-items:center; gap:8px; width:100%;}
.cat-top .cat-head{flex:1; min-width:0;}
.pdfbtn{flex:none; border:1.5px solid var(--line-strong); background:var(--surface);
  color:var(--ink-faint); border-radius:999px; padding:6px 11px; font-size:11.5px;
  font-weight:700; letter-spacing:.06em; display:inline-flex; align-items:center; gap:5px;}
.pdfbtn:hover{border-color:var(--accent); color:var(--accent);}
.pdfbtn svg{width:13px; height:13px;}
.addrow .pdfbtn{flex:0 0 auto; min-height:36px; padding:6px 12px;}

@media print{
  @page{ size:A4; margin:12mm; }
  body{background:#fff;}
  #app, #bg, #veil, .cta-fixed, .cartbar{display:none !important;}
  #imprimible{display:block !important; max-width:none; padding:0;}
  .pdf-i{background:#fff;}
}
.logo-slot{width:64px; height:64px; flex:none; border-radius:50%; border:1.5px solid var(--line-strong);
  background:var(--surface); display:grid; place-items:center; overflow:hidden; position:relative;
  font-family:'Fraunces',serif; font-size:31px; font-weight:600; color:var(--accent); line-height:1;}
/* el logo es una imagen ancha: la agrandamos y la centramos en la palabra Cake */
.logo-slot img{position:absolute; left:50%; top:50%; width:226%; height:auto; max-width:none;
  transform:translate(-46.6%,-45.6%); display:block;}
.brand{display:flex; flex-direction:column; margin-right:auto; min-width:0;}
.brand .nm{font-family:'Fraunces',serif; font-size:30px; font-weight:600; line-height:1; letter-spacing:-.01em;}
.brand .sub{font-size:9.5px; letter-spacing:.28em; text-transform:uppercase; color:var(--ink-soft);
  font-weight:700; margin-top:5px;}
/* el botón de WhatsApp del encabezado solo en pantallas grandes:
   abajo ya está la barra fija, y repetirlo confunde */
header.top .top-wa{display:none;}
@media (min-width:900px){ .top-wa{display:inline-flex;} .brand .nm{font-size:33px;} .brand .sub{font-size:10.5px;} }

.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; border:none;
  border-radius:999px; padding:11px 19px; font-weight:700; font-size:14.5px; text-decoration:none;
  background:var(--accent); color:var(--accent-ink); transition:transform .14s, filter .14s; min-height:44px;}
.btn:active{transform:scale(.97);}
.btn.wa{background:var(--wa); color:#fff;}
.btn.sm{padding:8px 15px; font-size:13.5px; min-height:0;}
.btn.ghost{background:transparent; color:var(--ink); border:1.5px solid var(--line-strong); font-weight:600;}
.btn.danger{background:var(--promo); color:#fff;}
.btn svg{width:17px; height:17px; flex:none;}

/* botón redondo de administración */
/* el candado no se ve: se entra agregando #admin al final de la dirección */
.adm-btn{display:none;}
body.modoadmin .adm-btn{flex:none; width:38px; height:38px; border-radius:50%;
  border:1.5px solid var(--line-strong); background:var(--surface); color:var(--ink-faint);
  display:grid; place-items:center; transition:background .15s, color .15s, border-color .15s;}
.adm-btn svg{width:16px; height:16px;}
.adm-btn:hover{border-color:var(--accent); color:var(--accent);}
.adm-btn.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}

/* anuncios */
.anuncios{border-bottom:1px solid var(--line); background:var(--accent-soft);}
.anuncio{display:flex; align-items:center; justify-content:center; gap:9px;
  padding:9px 16px; font-size:13.5px; color:var(--ink); text-align:center;}
.anuncio .dot{flex:none; width:6px; height:6px; border-radius:50%; background:var(--accent);}
.anuncio .ax{flex:none; background:none; border:none; color:var(--ink-faint); font-size:12px; font-weight:700;
  text-decoration:underline; text-underline-offset:2px;}

/* hero */
.hero{padding-block:24px 4px; text-align:center;}
.hero .eyebrow{font-size:10px; letter-spacing:.22em; text-transform:uppercase; font-weight:700;
  color:var(--ink-faint); margin-bottom:11px;}
.hero h1{font-size:clamp(27px,6.6vw,40px); line-height:1.1;}
.hero h1 em{font-style:italic; color:var(--accent);}
.hero p.lead{max-width:46ch; margin:12px auto 0; color:var(--ink-soft); font-size:16.5px;}
.hero .meta{margin-top:14px; font-size:13.5px; color:var(--ink-soft); display:flex; gap:7px; justify-content:center; flex-wrap:wrap;}

/* promos */
.promos{display:grid; gap:11px; margin-block:22px;}
@media (min-width:760px){ .promos{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));} }
.promo{background:var(--brownie); border:none; border-radius:var(--radius);
  padding:18px 20px; display:flex; gap:16px; align-items:center;
  box-shadow:0 10px 30px -14px rgba(94,48,35,.75);}
.promo.off{opacity:.5;}
.promo .pbadge{flex:none; background:var(--caramel); color:var(--brownie); border-radius:13px; padding:12px 14px;
  font-family:'Fraunces',serif; font-size:23px; font-weight:700; line-height:1; text-align:center; letter-spacing:-.02em;}
.promo .pt{font-family:'Fraunces',serif; font-size:19px; font-weight:600; line-height:1.2; color:#F7EFE4;}
.promo .pd{font-size:13.5px; color:rgba(247,239,228,.80); line-height:1.4; margin-top:3px;}
.promo .pu{font-size:11px; letter-spacing:.14em; text-transform:uppercase; font-weight:700; color:var(--caramel); margin-top:7px;}
.promoadmin{display:flex; gap:6px; margin-left:auto; flex:none;}
.promoadmin button{background:rgba(247,239,228,.12); border:1.5px solid rgba(247,239,228,.3);
  color:#F7EFE4; border-radius:9px; padding:6px 11px; font-size:12px; font-weight:600;}

/* buscador */
.search{position:relative; margin-bottom:22px;}
.search input{width:100%; font:inherit; font-size:15px; padding:12px 16px 12px 40px; border-radius:999px;
  border:1.5px solid var(--line-strong); background:var(--surface); color:var(--ink); min-height:46px;
  text-overflow:ellipsis;}
/* el lugar para la ✕ solo se reserva cuando hay algo escrito */
.search.conx input{padding-right:42px;}
.search .si{position:absolute; left:14px; top:50%; transform:translateY(-50%); width:17px; height:17px; color:var(--ink-faint);}
.search .sx{position:absolute; right:8px; top:50%; transform:translateY(-50%); width:30px; height:30px;
  border-radius:50%; border:none; background:var(--surface-2); color:var(--ink-soft); font-size:14px; line-height:1;}

/* pasos / barra lateral */
.layout{display:block; margin-block:6px 30px;}
@media (min-width:900px){
  .layout{display:grid; grid-template-columns:238px minmax(0,1fr); gap:32px; align-items:start;}
}
.side{display:none;}
@media (min-width:900px){
  .side{display:block; position:sticky; top:calc(88px + env(safe-area-inset-top,0px));
    max-height:calc(100vh - 110px); overflow-y:auto; overscroll-behavior:contain;
    padding-right:6px; scrollbar-width:thin;}
  .side::-webkit-scrollbar{width:7px;}
  .side::-webkit-scrollbar-thumb{background:var(--line-strong); border-radius:99px;}
  .side::-webkit-scrollbar-track{background:transparent;}
}
.steps{display:block; margin-block:4px 22px;}
@media (min-width:900px){ .steps{display:none;} }
.sblock{margin-bottom:24px;}
.sblock > h3{font-size:12.5px; letter-spacing:.04em; color:var(--ink);
  font-family:'Karla',sans-serif; font-weight:700; margin-bottom:10px;
  display:flex; align-items:center; gap:8px;}
.sblock > h3 .step{flex:none; width:21px; height:21px; border-radius:50%; background:var(--accent);
  color:var(--accent-ink); font-size:11.5px; display:grid; place-items:center; font-weight:700;}
.chips{display:flex; gap:7px; flex-wrap:wrap;}
.chip{border:1.5px solid var(--line-strong); background:var(--surface); color:var(--ink-soft);
  border-radius:999px; padding:8px 14px; font-size:14px; font-weight:600;
  transition:transform .14s, background .14s, color .14s, border-color .14s; min-height:40px;}
.chip:active{transform:scale(.95);}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
.cgroup{margin-bottom:12px;}
.glabel{display:block; font-size:11px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--ink-faint); font-weight:700; margin-bottom:6px;}

/* secciones */
section.cat{margin-bottom:34px;}
.cat-head{display:flex; align-items:center; gap:10px; flex-wrap:wrap; width:100%;
  background:none; border:none; padding:0; text-align:left; cursor:pointer; color:var(--ink);}
.cat-head h2{font-size:26px; letter-spacing:-.015em; color:var(--ink);}
.cat-head .note{font-size:13px; color:var(--ink-soft);}
.cat-head .cnt{margin-left:auto; font-size:13px; color:var(--ink-faint); font-weight:700;}
.cat-head .chev{flex:none; width:26px; height:26px; border-radius:50%; background:var(--accent-soft);
  display:grid; place-items:center; transition:transform .2s;}
.cat-head .chev svg{width:14px; height:14px; color:var(--accent);}
.cat-head[aria-expanded="false"] .chev{transform:rotate(-90deg);}
.rule{height:2px; background:var(--line); margin:11px 0 20px;}
.cat-head[aria-expanded="false"] + .rule{margin-bottom:0;}
.grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px;}
@media (min-width:620px){ .grid{grid-template-columns:repeat(auto-fill,minmax(224px,1fr)); gap:15px;} }

/* en celular entran dos tarjetas por fila, así que todo adentro achica */
@media (max-width:619px){
  .card .body{padding:11px 12px 0; gap:5px;}
  .card .nm{font-size:16px; line-height:1.15;}
  .card .ds{font-size:11.5px; line-height:1.35;}
  .card .porc{font-size:10.5px; padding:3px 8px;}
  .prices{padding-top:9px;}
  .prow .pl{font-size:10px; letter-spacing:.05em;}
  .prow .pv{font-size:18px; gap:5px;}
  .prow .pv s{font-size:11.5px;}
  .prow.sec .pv{font-size:14px;}
  .prow.sec .pv s{font-size:11px;}
  .card .act{padding:10px 12px 12px;}
  .addrow{flex-wrap:wrap; gap:5px;}
  .addrow .btn{font-size:12px; padding:8px 7px; min-height:36px; flex:1 1 100%;}
  .addrow .qt{width:100%; justify-content:space-between;}
  .incl{grid-template-columns:1fr; font-size:11px; gap:1px;}
  .relldet > summary{font-size:11.5px;}
  .relldet .rb, .relldet ul{font-size:11.5px;}
  .offtag{font-size:10px; padding:4px 8px;}
  .phcount{font-size:10px; padding:3px 8px;}
}

/* ajustes generales de celular */
@media (max-width:619px){
  html, body{overflow-x:hidden;}
  .wrap{padding-inline:14px;}
  .hero{padding-block:16px 2px;}
  .hero h1{font-size:clamp(23px,6.8vw,34px);}
  .hero p.lead{font-size:14.5px; margin-top:9px;}
  .promo{padding:14px 15px; gap:12px; border-radius:16px;}
  .cat-head h2{font-size:21px;}
  .cat-head .note{font-size:12px;}
  .info{padding:18px 16px; gap:20px; margin-block:22px;}
  .igrid{gap:9px;}
  footer.foot .fb{font-size:25px;}
  .lead, .hint{font-size:13.5px;}
  /* que la barra fija de WhatsApp no tape el final */
  .spacer{height:78px;}
}

/* filtros plegables en celular */
.filtros{border:1.5px solid var(--line-strong); border-radius:16px; background:var(--surface);
  margin-top:10px; overflow:hidden;}
.filtros > summary{list-style:none; cursor:pointer; padding:13px 16px;
  display:flex; align-items:center; gap:10px; font-size:15px; font-weight:700; color:var(--ink);}
.filtros > summary::-webkit-details-marker{display:none;}
.filtros > summary .st{margin-left:auto; font-weight:600; font-size:12.5px; color:var(--ink-faint);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:52%;}
.filtros > summary::after{content:''; flex:none; width:8px; height:8px; margin-left:2px;
  border-right:2.2px solid var(--accent); border-bottom:2.2px solid var(--accent);
  transform:rotate(45deg) translate(-2px,-2px); transition:transform .2s;}
.filtros[open] > summary::after{transform:rotate(225deg) translate(-1px,-1px);}
.filtros .fbody{padding:2px 16px 14px; border-top:1px solid var(--line);}
.filtros .sblock:last-child{margin-bottom:4px;}

/* tarjeta */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  overflow:hidden; display:flex; flex-direction:column; box-shadow:var(--shadow); position:relative;}
.card.off{opacity:.45;}
.card .ph{aspect-ratio:1/1; background:var(--surface-2); position:relative; overflow:hidden;}
.card .ph.clic{cursor:zoom-in;}
.card .ph img{width:100%; height:100%; object-fit:contain; position:relative; z-index:1;}
.card .ph .mark{position:absolute; inset:0; display:grid; place-items:center; color:var(--line-strong);}
.card .ph .mark svg{width:54px;}
.offtag{position:absolute; top:10px; left:10px; z-index:3; background:var(--promo); color:#fff;
  font-size:12px; font-weight:700; padding:5px 11px; border-radius:999px; letter-spacing:.02em;
  box-shadow:0 4px 12px -4px rgba(0,0,0,.4);}
.phcount{position:absolute; right:9px; bottom:9px; z-index:3; background:rgba(58,28,18,.78); color:#F7EFE4;
  font-size:11.5px; font-weight:700; padding:5px 10px; border-radius:999px; pointer-events:none;}
.card .body{padding:14px 16px 0; display:flex; flex-direction:column; gap:7px; flex:1;}
.card .nm{font-family:'Fraunces',serif; font-size:20px; font-weight:600; line-height:1.18; color:var(--ink);}
.card .ds{font-size:13.5px; color:var(--ink-soft); line-height:1.45;}
.porc{align-self:flex-start; background:var(--accent); color:var(--accent-ink);
  font-size:12px; font-weight:700; padding:5px 12px; border-radius:999px; letter-spacing:.01em;}
.incl{display:grid; grid-template-columns:repeat(auto-fill,minmax(116px,1fr)); gap:3px 13px; padding:0; margin:4px 0;}
.incl li{font-size:12.5px; color:var(--ink-soft); list-style:none;}
.incl li b{color:var(--ink); font-weight:700;}
.prices{margin-top:auto; padding-top:11px; display:flex; flex-direction:column; gap:3px;}
.prow{display:flex; align-items:baseline; justify-content:space-between; gap:10px;}
.prow .pl{font-size:12px; color:var(--ink-soft); font-weight:700; letter-spacing:.07em; text-transform:uppercase;}
.prow .pv{font-size:23px; font-weight:700; letter-spacing:-.015em; display:flex; align-items:baseline; gap:7px; color:var(--ink);}
.prow .pv s{font-size:14px; font-weight:600; color:var(--ink-faint);}
.prow .pv .now{color:var(--promo);}
.prow.sec .pv{font-size:17px; color:var(--ink-soft);}
.prow.sec .pv s{font-size:13px;}
.card .act{padding:13px 16px 16px;}
.addrow{display:flex; gap:6px; align-items:stretch;}
.addrow .btn{flex:1; min-width:0; padding:9px 10px; font-size:13px; min-height:40px;
  white-space:nowrap; gap:5px;}
.addrow .btn svg{width:15px; height:15px;}
.addrow .btn.add{background:transparent; color:var(--accent); border:1.5px solid var(--accent);
  font-weight:700; flex:0 1 auto; padding:9px 13px;}
.addrow .btn.add:hover{background:var(--accent); color:var(--accent-ink);}
.addrow .qt{display:flex; align-items:center; gap:2px; background:var(--accent);
  border-radius:999px; padding:3px; flex:0 0 auto;}
.addrow .qt button{width:28px; height:28px; border:none; border-radius:50%; background:transparent;
  color:var(--accent-ink); font-size:17px; font-weight:700; line-height:1; cursor:pointer;
  display:grid; place-items:center;}
.addrow .qt button:hover{background:rgba(255,255,255,.2);}
.addrow .qt b{min-width:20px; text-align:center; color:var(--accent-ink); font-size:15px;}

/* ---------- carrito ---------- */
.cartbar{position:fixed; left:0; right:0; bottom:0; z-index:60; background:var(--brownie); color:#F7EFE4;
  padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -6px 24px rgba(42,21,16,.24);}
.cartbar .in{max-width:1180px; margin:0 auto; padding-inline:18px;
  display:flex; gap:12px; align-items:center;}
.cartbar .qn{flex:1; min-width:0;}
.cartbar .qn b{display:block; font-size:14.5px;}
.cartbar .qn span{font-size:12.5px; opacity:.85;}
.cartbar .btn{background:var(--caramel); color:var(--brownie); padding:11px 19px; font-size:14.5px;
  transition:transform .13s;}
.cartbar .btn:active{transform:scale(.95);}
.cartbar.entra{animation:barraSube .34s cubic-bezier(.2,.8,.3,1) both;}
.cartbar.late .qn b{animation:latido .36s ease;}
@keyframes barraSube{from{transform:translateY(100%);} to{transform:none;}}
@keyframes latido{0%,100%{transform:scale(1);} 30%{transform:scale(1.1);}}

.lineas{max-height:38vh; overflow-y:auto;}
.ln{display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--line);}
.ln:last-child{border-bottom:none;}
.ln .nb{flex:1; min-width:0; font-size:15px; font-weight:700; line-height:1.25;}
.ln .nb small{display:block; font-weight:400; font-size:12.5px; color:var(--ink-faint);}
.ln .qt{display:flex; align-items:center; gap:3px; border:1.5px solid var(--line-strong);
  border-radius:999px; padding:2px;}
.ln .qt button{width:24px; height:24px; border:none; border-radius:50%; background:transparent;
  color:var(--accent); font-size:16px; font-weight:700; line-height:1; cursor:pointer;}
.ln .qt b{min-width:18px; text-align:center; font-size:14px;}
.ln .sb{width:84px; text-align:right; font-weight:700; font-size:14.5px;}
.ln .rm{width:26px; height:26px; border:none; background:none; color:var(--ink-faint);
  font-size:16px; line-height:1; border-radius:50%; flex:none; cursor:pointer;}
.ln .rm:hover{background:var(--surface-2); color:var(--promo);}
.total{display:flex; align-items:baseline; justify-content:space-between; margin-top:14px;
  padding-top:13px; border-top:2px solid var(--line-strong);}
.total span{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint); font-weight:700;}
.total b{font-family:'Fraunces',serif; font-size:27px; font-weight:600;}
.rarezas .inspi-head h2{color:var(--brownie);}
.rarezas .icard{border-color:var(--caramel);}
.avisosena{background:var(--accent-soft); border-radius:12px; padding:11px 14px; margin-top:13px;
  font-size:13px; color:var(--ink-soft); line-height:1.4;}
/* el detalle del pedido, compacto para que entre en una pantalla */
dialog.pedido{max-height:92vh;}
dialog.pedido .dlg-h{position:relative; padding-bottom:6px;}
dialog.pedido .dlg-h h3{padding-right:40px;}
.cerrarx{position:absolute; right:0; top:-2px; width:34px; height:34px; border-radius:50%;
  border:1.5px solid var(--line-strong); background:var(--surface); color:var(--ink-soft);
  font-size:16px; line-height:1; display:grid; place-items:center; cursor:pointer;}
.cerrarx:hover{border-color:var(--accent); color:var(--accent);}
dialog.pedido .dlg-b{padding-top:6px; padding-bottom:10px;}
dialog.pedido .fld{margin-bottom:9px;}
dialog.pedido .fld span{font-size:9.5px; margin-bottom:3px;}
dialog.pedido .fld input, dialog.pedido .fld textarea{padding:8px 11px; font-size:14px; border-radius:9px;}
dialog.pedido .fld textarea{min-height:42px;}
/* La lista de productos tiene su propia barrita: así los datos del pedido
   —fecha, pago, aclaraciones— quedan siempre a la vista sin scrollear. */
dialog.pedido[open]{display:flex; flex-direction:column;}
dialog.pedido .dlg-b{flex:1 1 auto; min-height:0; max-height:none; overflow-y:auto;}
dialog.pedido .lineas{max-height:min(32vh, 240px); overflow-y:auto; overscroll-behavior:contain;
  padding-right:7px; scrollbar-width:thin; scrollbar-color:var(--line-strong) transparent;}
dialog.pedido .lineas::-webkit-scrollbar{width:7px;}
dialog.pedido .lineas::-webkit-scrollbar-thumb{background:var(--line-strong); border-radius:99px;}
dialog.pedido .lineas::-webkit-scrollbar-track{background:transparent;}
dialog.pedido .ln{padding:7px 0;}
dialog.pedido .ln .nb{font-size:14px;}
dialog.pedido .ln .nb small{font-size:11.5px;}
dialog.pedido .total{margin-top:9px; padding-top:8px;}
dialog.pedido .total b{font-size:22px;}
dialog.pedido .avisosena{margin-top:8px; padding:8px 11px; font-size:11.5px; line-height:1.35;}
dialog.pedido .segm{gap:6px;}
dialog.pedido .segm button{flex:1 1 0; min-width:92px; padding:8px 5px; font-size:12.5px;}
dialog.pedido .dlg-f{padding-top:10px;}
dialog.pedido .btn.wa{padding:12px 18px;}

.segm{display:flex; gap:7px; flex-wrap:wrap;}
.segm button{flex:1 1 44%; min-width:96px; border:1.5px solid var(--line-strong);
  background:var(--ground); color:var(--ink); border-radius:11px; padding:10px 6px;
  font-size:13.5px; font-weight:700; cursor:pointer; white-space:nowrap;
  transition:background .16s, color .16s, border-color .16s, transform .12s;}
.segm button:active{transform:scale(.96);}
.segm button.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}

/* la tortita que vuela al carrito */
.volador{position:fixed; z-index:90; pointer-events:none;
  filter:drop-shadow(0 8px 16px rgba(58,28,18,.3)); color:var(--accent);}
.volador svg{width:100%; height:100%; display:block;}

.relldet{border-top:1px solid var(--line); padding-top:9px; margin-top:2px;}
.relldet > summary{list-style:none; cursor:pointer; font-size:12.5px; font-weight:700;
  color:var(--accent); display:flex; align-items:center; gap:6px;}
.relldet > summary::-webkit-details-marker{display:none;}
.relldet > summary::after{content:''; width:7px; height:7px; border-right:2px solid currentColor;
  border-bottom:2px solid currentColor; transform:rotate(45deg) translate(-2px,-2px); transition:transform .2s;}
.relldet[open] > summary::after{transform:rotate(225deg) translate(-1px,-1px);}
.relldet .rb{font-size:12.5px; color:var(--ink-soft); margin:8px 0 5px; line-height:1.4;}
.relldet ul{margin:0 0 9px; padding-left:15px; font-size:12.5px; color:var(--ink-soft); line-height:1.6;}
.relldet ul:last-child{margin-bottom:0;}
.relldet .gr{font-size:10px; letter-spacing:.14em; text-transform:uppercase; font-weight:700;
  color:var(--accent); margin:0 0 4px;}

/* controles de admin en la tarjeta */
.cardadmin{display:flex; gap:5px; padding:0 16px 14px; flex-wrap:wrap; align-items:center;}
.cardadmin button{background:transparent; border:1.5px solid var(--line-strong); color:var(--ink-soft);
  border-radius:9px; padding:6px 10px; font-size:12px; font-weight:600; min-height:34px;}
.cardadmin button:hover{border-color:var(--accent); color:var(--accent);}
.cardadmin .mv{width:34px; padding:0; font-size:14px;}
.cardadmin .del{margin-left:auto; border-color:transparent; color:var(--promo);}

/* visor de fotos */
dialog{border:none; padding:0; background:var(--surface); color:var(--ink);
  box-shadow:0 24px 60px -20px rgba(0,0,0,.45); max-width:540px; width:calc(100% - 24px); border-radius:20px;}
dialog::backdrop{background:rgba(40,22,12,.62);}
dialog.lb{position:fixed; inset:0; margin:auto; padding:0; border:none;
  width:min(880px,94vw); max-width:94vw; height:max-content; max-height:92vh;
  border-radius:18px; overflow:hidden;}
dialog.lb img{width:100%; max-height:74vh; object-fit:contain; background:var(--surface-2); display:block;}
/* respaldo para navegadores viejos de celular que no abren <dialog> */
dialog.lb.lb-plano{position:fixed; z-index:120; left:50%; top:50%;
  transform:translate(-50%,-50%); margin:0; border:none;
  box-shadow:0 20px 60px rgba(42,21,16,.5);}
@media (max-width:619px){
  dialog.lb{width:94vw;}
  dialog.lb img{max-height:68vh;}
  .lbt{font-size:16px;}
  .lbn{width:38px; height:38px; font-size:19px;}
  .lbbar{padding:11px 13px calc(13px + env(safe-area-inset-bottom,0px)); gap:8px;}
}
.lbbar{display:flex; align-items:center; gap:10px; padding:13px 16px calc(15px + env(safe-area-inset-bottom,0px));}
.lbt{flex:1; min-width:0; font-family:'Fraunces',serif; font-size:19px; font-weight:600; line-height:1.2;}
.lbc{font-size:13px; color:var(--ink-faint); font-weight:700; white-space:nowrap;}
.lbn{flex:none; width:42px; height:42px; border-radius:50%; border:1.5px solid var(--line-strong);
  background:var(--surface); color:var(--ink); font-size:21px; line-height:1;}
.lbx{position:absolute; top:10px; right:10px; z-index:4; width:38px; height:38px; border-radius:50%;
  border:none; background:rgba(58,28,18,.75); color:#F7EFE4; font-size:16px; line-height:1;}

/* formularios */
.dlg-h{padding:18px 20px 0; display:flex; align-items:baseline; gap:10px;}
.dlg-h h3{font-size:20px; flex:1;}
.dlg-b{padding:14px 20px 20px; display:flex; flex-direction:column; gap:13px; max-height:66vh; overflow-y:auto;}
.dlg-f{padding:13px 20px calc(16px + env(safe-area-inset-bottom,0px)); border-top:1px solid var(--line); display:flex; gap:9px;}
.dlg-f .btn{flex:1;}
.fld{display:flex; flex-direction:column; gap:5px;}
.fld > span{font-size:11px; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-faint); font-weight:700;}
.fld input, .fld textarea, .fld select{font:inherit; font-size:16px; padding:11px 12px; border-radius:11px;
  border:1.5px solid var(--line-strong); background:var(--ground); color:var(--ink); width:100%;}
.fld textarea{resize:vertical; min-height:64px;}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.checks{display:flex; flex-wrap:wrap; gap:7px;}
.checks label{display:inline-flex; align-items:center; gap:6px; font-size:13.5px;
  border:1.5px solid var(--line-strong); border-radius:999px; padding:8px 13px; cursor:pointer;}
.checks input{accent-color:var(--accent);}
.err{font-size:13px; color:var(--promo); font-weight:600; margin:0;}

/* editor de fotos */
.fotolist{display:flex; flex-direction:column; gap:8px;}
.fotorow{display:flex; align-items:center; gap:10px; padding:8px; border:1.5px solid var(--line);
  border-radius:12px; background:var(--ground);}
.fotorow img{width:54px; height:54px; object-fit:cover; border-radius:8px; flex:none; background:var(--surface-2);}
.fotorow .fp{flex:1; min-width:0; font-size:12px; color:var(--ink-soft); word-break:break-all; line-height:1.35;}
.fotorow .fb2{display:flex; gap:4px; flex:none;}
.fotorow button{width:32px; height:32px; border-radius:8px; border:1.5px solid var(--line-strong);
  background:transparent; color:var(--ink-soft); font-size:13px; line-height:1;}
.fotorow button.dl{color:var(--promo); border-color:transparent;}

/* barra de administración */
.adminbar{position:fixed; left:0; right:0; bottom:0; z-index:60; background:var(--ink); color:var(--ground);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));
  display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
.adminbar .lbl{font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; font-weight:700; opacity:.6; width:100%;}
.adminbar button{background:transparent; border:1.5px solid rgba(255,255,255,.26); color:inherit;
  border-radius:999px; padding:8px 14px; font-size:13px; font-weight:600; min-height:40px;}
.adminbar button.pri{background:var(--caramel); border-color:var(--caramel); color:var(--brownie); font-weight:700;}
.adminbar button.pri[disabled]{opacity:.45;}
.adminbar .sp{margin-left:auto; font-size:11.5px; opacity:.6;}
body.admin .spacer{height:150px;}

.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:96px; z-index:90;
  background:var(--ink); color:var(--ground); padding:11px 20px; border-radius:999px;
  font-size:14px; font-weight:600; box-shadow:var(--shadow); max-width:90vw; text-align:center;}

/* inspiración */
.inspi{margin-block:38px 30px;}
.inspi-head{text-align:center; max-width:52ch; margin:0 auto 20px;}
.inspi-head h2{font-size:clamp(23px,5.2vw,30px); line-height:1.15;}
.inspi-head p{margin:9px 0 0; font-size:15px; color:var(--ink-soft);}
.igrid{display:grid; grid-template-columns:repeat(2,1fr); gap:11px;}
@media (min-width:660px){ .igrid{grid-template-columns:repeat(3,1fr); gap:14px;} }
@media (min-width:980px){ .igrid{grid-template-columns:repeat(4,1fr);} }
.icard{position:relative; border-radius:14px; overflow:hidden; background:var(--surface-2);
  aspect-ratio:3/4; display:block; border:1px solid var(--line);}
.icard img{width:100%; height:100%; object-fit:cover;}
.icard .cap{position:absolute; left:0; right:0; bottom:0; padding:22px 12px 11px;
  background:linear-gradient(to top, rgba(58,28,18,.88), rgba(58,28,18,0));
  color:#F7EFE4; font-size:13px; font-weight:700; line-height:1.25;}
.icard .want{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  background:rgba(58,28,18,.62); opacity:0; transition:opacity .18s; text-decoration:none;}
.icard .want span{background:var(--wa); color:#fff; font-size:13px; font-weight:700; padding:9px 15px; border-radius:999px;}
.icard:hover .want, .icard:focus-within .want{opacity:1;}
@media (hover:none){ .icard .want{opacity:1; background:transparent; align-items:flex-end;
  justify-content:flex-end; padding:9px;} .icard .want span{font-size:11.5px; padding:7px 12px;} }
.icard.empty{border:2px dashed var(--line-strong); background:transparent;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;}
.icard.empty svg{width:44px; color:var(--line-strong);}
.icard.empty span{font-size:11.5px; font-weight:700; color:var(--ink-faint); letter-spacing:.06em; text-transform:uppercase;}

/* info + plan */
.info{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:22px; margin-block:28px; display:grid; gap:24px; box-shadow:var(--shadow);}
@media (min-width:760px){ .info{grid-template-columns:repeat(3,1fr); padding:26px 28px;} }
.info h3{font-size:12.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--accent);
  margin-bottom:11px; font-family:'Karla',sans-serif; font-weight:700;}
.info ul{margin:0; padding-left:17px; font-size:14.5px; color:var(--ink-soft);}
.info li{margin-bottom:6px;}
.info .cafep{margin:0 0 13px; font-size:14.5px; color:var(--ink-soft); line-height:1.5;}
.planbox{margin-top:17px; padding:2px 0 2px 15px; border-left:3px solid var(--caramel);}
.planbox .pk{display:block; font-family:'Fraunces',serif; font-size:20px; font-weight:600;
  color:var(--ink); line-height:1.15; margin-bottom:5px;}
.planbox .ptx{font-size:13.5px; line-height:1.5; color:var(--ink-soft);}

/* pie */
footer.foot{border-top:1px solid var(--line); padding-block:30px; text-align:center; color:var(--ink-soft); font-size:14px;}
footer.foot .fb{font-family:'Fraunces',serif; font-size:30px; color:var(--ink); font-weight:600; line-height:1;}
footer.foot .fs{font-size:10px; letter-spacing:.28em; text-transform:uppercase; color:var(--ink-soft); font-weight:700; margin-top:7px;}
footer.foot .iglinks{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:14px;}
.iglink{display:inline-flex; align-items:center; gap:7px; text-decoration:none; font-size:14px; font-weight:700;
  color:var(--accent); border:1.5px solid var(--line-strong); border-radius:999px; padding:8px 15px;}
.iglink:hover{background:var(--accent-soft); border-color:var(--accent);}
.iglink svg{width:16px; height:16px;}
.maplink{display:inline-flex; align-items:center; gap:6px; color:var(--accent); font-weight:700;
  text-decoration:underline; text-underline-offset:3px; text-decoration-color:var(--line-strong);}
.maplink svg{width:15px; height:15px; flex:none;}
.spacer{height:96px;}

/* barra fija de contacto */
.cta-fixed{position:fixed; left:0; right:0; bottom:0; z-index:45;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to top, var(--ground) 62%, transparent); display:flex; justify-content:center;}
@media (min-width:900px){ .cta-fixed.only-mobile{display:none;} }
.cta-fixed .btn{width:100%; max-width:440px; box-shadow:0 8px 24px -8px rgba(31,122,61,.55);}

/* animación */
@keyframes drift{0%,100%{transform:translate3d(0,0,0) rotate(var(--rot,0deg));}
  50%{transform:translate3d(0,-16px,0) rotate(calc(var(--rot,0deg) + 3deg));}}
@keyframes rise{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;}}
@keyframes breathe{0%,100%{box-shadow:0 8px 24px -8px rgba(31,122,61,.45);}
  50%{box-shadow:0 10px 30px -6px rgba(31,122,61,.7);}}
@keyframes pop{from{opacity:0; transform:scale(.96);} to{opacity:1; transform:none;}}
@media (prefers-reduced-motion: no-preference){
  #bg .b1{--rot:-8deg; animation:drift 19s ease-in-out infinite;}

}

      irAResultados = false;
      if(sy) window.scrollTo(0, sy); /* no saltar al principio al editar o filtrar */
    }
    animEntrada = false;             /* la entrada escalonada corre una sola vez */
    tocado = null;
    barraVisible = (!isAdm && cantCarrito() > 0);
    animarTotal();
  }

  /* --- el total contando --- */
  function animarTotal(){
    var el = document.querySelector('.cartbar .qn span');
    var hasta = totalCarrito();
    if(!el){ totalMostrado = hasta; return; }
    var desde = totalMostrado;
    if(desde === hasta || sinMovimiento){
      el.textContent = 'Total estimado ' + money(hasta);
      totalMostrado = hasta; return;
    }
    var t0 = performance.now(), dur = 520;
    (function paso(t){
      var k = Math.min(1, (t - t0) / dur);
      var e = 1 - Math.pow(1 - k, 3);
      var v = Math.round((desde + (hasta - desde) * e) / 100) * 100;
      el.textContent = 'Total estimado ' + money(k < 1 ? v : hasta);
      if(k < 1) requestAnimationFrame(paso); else totalMostrado = hasta;
    })(t0);
  }

  /* --- la tortita volando al carrito --- */
  function volarTortita(card){
    if(!card || sinMovimiento) return;
    var ph = card.querySelector('.ph') || card;
    var r = ph.getBoundingClientRect();
    if(!r.width) return;

    var ancho = Math.min(r.width * .6, 80), alto = ancho;
    var x0 = r.left + r.width / 2 - ancho / 2;
    var y0 = r.top  + r.height / 2 - alto / 2;

    var el = document.createElement('div');
    el.className = 'volador';
    el.innerHTML = ART.monito;
    el.style.left = x0 + 'px'; el.style.top = y0 + 'px';
    el.style.width = ancho + 'px'; el.style.height = alto + 'px';
    document.body.appendChild(el);

    requestAnimationFrame(function(){
      var dest = document.querySelector('.cartbar .btn');
      var dr = dest ? dest.getBoundingClientRect()
                    : { left: window.innerWidth - 100, top: window.innerHeight - 56, width:70, height:42 };
      var dx = (dr.left + dr.width / 2)  - (x0 + ancho / 2);
      var dy = (dr.top  + dr.height / 2) - (y0 + alto / 2);
      var fin = function(){ if(el.parentNode) el.remove(); };
      if(!el.animate){ fin(); return; }
      el.animate([
        { transform:'translate(0,0) scale(.5) rotate(-6deg)', opacity:0 },
        { transform:'translate(' + (dx * .12) + 'px,' + (dy * .05 - 26) + 'px) scale(1.06) rotate(4deg)',
          opacity:1, offset:.22 },
        { transform:'translate(' + (dx * .5) + 'px,' + (dy * .4 - 58) + 'px) scale(.78) rotate(-5deg)',
          opacity:1, offset:.58 },
        { transform:'translate(' + dx + 'px,' + dy + 'px) scale(.16) rotate(8deg)', opacity:0 }
      ], { duration:780, easing:'cubic-bezier(.36,.06,.3,1)' }).onfinish = fin;
      setTimeout(fin, 1200);
    });
  }

  /* Si una foto de la galería no existe, la tarjeta se saca sola.
     Si al final no quedó ninguna, se muestran los recuadros punteados. */
  function vacias(){

    return h;

  window.cakeSinFoto = function(img){

  /* ===========================================================
     FOTOS EXTRA AUTOMÁTICAS
     Si un producto tiene "Torta.jpeg", la página busca sola
     "Torta 2.jpeg", "Torta 3.jpeg"… y también "Torta (2).jpeg",
     que es como las numera Windows. Las que encuentra las suma.
     =========================================================== */
  function baseDeFoto(u){
    var m = String(u).match(/^(.*?)(\.[a-z0-9]+)$/i);
    if(!m) return null;
    return { base: m[1].replace(/(?:%20|\s)*(?:\(\d+\)|\d+)$/, ''), ext: m[2] };
  }
  function probarFoto(url, cb){
    var i = new Image();
    i.onload  = function(){ cb(true); };
    i.onerror = function(){ cb(false); };
    i.src = url;
  }
  /* Galerías automáticas: busca "prefijo 1", "prefijo 2"… hasta que falta uno.
     Sirve para «Modelos de inspiración» y para «Fuera de molde». */
  function autoGaleria(prefijos, listo){
    var out = [], exts = ['.jpeg', '.jpg', '.png'], vacios = 0;

    (function porNumero(n){
      if(n > 24 || vacios >= 4){ listo(out); return; }

      /* n = 0 es el archivo sin número: "fuera de molde.jpeg" */
      var cands = [];
      prefijos.forEach(function(pf){
        exts.forEach(function(e){
          if(n === 0) cands.push('fotos/' + encodeURIComponent(pf) + e);
          else {
            cands.push('fotos/' + encodeURIComponent(pf + ' ' + n) + e);
            cands.push('fotos/' + encodeURIComponent(pf + ' (' + n + ')') + e);
          }
        });
      });

      var k = 0;
      (function probar(){
        if(k >= cands.length){ vacios++; porNumero(n + 1); return; }
        var u = cands[k++];
        probarFoto(u, function(ok){
          if(ok){
            vacios = 0;
            if(out.indexOf(u) === -1) out.push(u);
            porNumero(n + 1);
          } else probar();
        });
      })();
    })(0);
  }

  function cargarGalerias(listo){
    var falta = 2, hubo = false;
    var fin = function(){ if(--falta === 0 && hubo) listo(); };

    autoGaleria(['inspiracion', 'inspiración', 'modelo'], function(fs){
      if(fs.length){
        state.inspiracion = fs.map(function(f, i){
          return { id:'i' + (i+1), foto:f, titulo:'', activo:true }; });
        hubo = true;
      }
      fin();

    autoGaleria(['fuera de molde', 'rara'], function(fs){

          return { id:'r' + (i+1), foto:f, titulo:'', activo:true }; });
        hubo = true;
      }

    });
  }

  /* el nombre del archivo puede estar en minúscula o sin tildes */
  function sinTildes(s){
    return String(s).normalize ? String(s).normalize('NFD').replace(/[̀-ͯ]/g, '') : String(s);
  }
  function variantesNombre(n){
    var a = [n, n.toLowerCase(), sinTildes(n), sinTildes(n).toLowerCase()];
    return a.filter(function(v, i){ return a.indexOf(v) === i; });
  }

  /* Parte una ruta en carpeta + nombre + extensión, ya sin codificar */
  function partesRuta(u){
    var d; try{ d = decodeURIComponent(String(u)); }catch(e){ d = String(u); }
    var i = d.lastIndexOf('/');
    var dir = i < 0 ? 'fotos/' : d.slice(0, i + 1);
    var f   = i < 0 ? d : d.slice(i + 1);
    var j   = f.lastIndexOf('.');
    return { dir:dir, base:(j < 0 ? f : f.slice(0, j)), ext:(j < 0 ? '.jpeg' : f.slice(j)) };
  }
  function armarRuta(dir, base, ext){ return dir + encodeURIComponent(base + ext); }

  /* prueba una lista de candidatos y devuelve el primero que exista */
  function primeraQueCarga(lista, cb){
    var i = 0;
    (function paso(){
      if(i >= lista.length){ cb(null); return; }
      var u = lista[i++];
      probarFoto(u, function(ok){ if(ok) cb(u); else paso(); });
    })();
  }

  function autoFotos(listo){
    var pend = 0, hubo = false;

    /* Solo salimos a buscar fotos de los productos que no tienen ninguna.
       Los que ya están resueltos arriba se dibujan bien de entrada y no
       generan ni una consulta de más. */
    (state.products || []).filter(function(p){ return !photosOf(p).length; })
      .forEach(function(p){
      pend++;
      var conf = photosOf(p), antes = conf.join('|'), lista = [];

      var terminar = function(){
        p.fotos = lista; delete p.photo;
        if(lista.join('|') !== antes) hubo = true;
        if(--pend === 0 && hubo) listo();
      };

      /* con la primera ya resuelta, busca 2, 3, 4… tolerando huecos */
      var extender = function(){
        var q = partesRuta(lista[0]);
        var raiz = q.base.replace(/\s*(?:\(\d+\)|\d+)$/, '');
        var fallas = 0;
        (function siguiente(n){
          if(n > 10 || fallas > 2){ terminar(); return; }
          var cands = [];
          variantesNombre(raiz).forEach(function(b){
            cands.push(armarRuta(q.dir, b + ' ' + n, q.ext));
            cands.push(armarRuta(q.dir, b + ' (' + n + ')', q.ext));
          });
          primeraQueCarga(cands, function(u){
            if(u){ fallas = 0; if(lista.indexOf(u) === -1) lista.push(u); }
            else fallas++;
            siguiente(n + 1);
          });
        })(2);
      };

      /* 1 · verificamos las cargadas a mano, probando mayúsculas y tildes */
      var i = 0;
      (function verificar(){
        if(i < conf.length){
          var q = partesRuta(conf[i++]);
          var cands = variantesNombre(q.base).map(function(b){
            return armarRuta(q.dir, b, q.ext); });
          primeraQueCarga(cands, function(u){
            if(u && lista.indexOf(u) === -1) lista.push(u);
            verificar();
          });
          return;
        }
        if(lista.length){ extender(); return; }

        /* 2 · si no quedó ninguna, buscamos por el nombre del producto */
        var cands = [];
        ['.jpeg', '.jpg', '.png'].forEach(function(e){
          variantesNombre(p.name).forEach(function(b){
            cands.push(armarRuta('fotos/', b, e));
          });
        });
        ['.jpeg', '.jpg'].forEach(function(e){
          variantesNombre(p.name).forEach(function(b){
            cands.push(armarRuta('fotos/', b + ' (2)', e));
          });
        });
        primeraQueCarga(cands, function(u){
          if(u){ lista.push(u); extender(); } else terminar();
        });
      })();
    });
  }

  /* ===========================================================
     VISOR DE FOTOS
     =========================================================== */
  var lb = null, lbScroll = 0;
  function closeLb(){
    if(lb){ lb.close(); lb.remove(); lb = null; }
    window.scrollTo(0, lbScroll);
  }
  function openGal(id){
    var p = findById(id); if(!p) return;
    var fs = photosOf(p); if(!fs.length) return;
    var i = 0;
    lbScroll = window.scrollY;
    lb = document.createElement('dialog'); lb.className = 'lb';
    function paint(){
      lb.innerHTML = '<button class="lbx" data-x aria-label="Cerrar">✕</button>'
        + '<img src="' + esc(fs[i]) + '" alt="' + esc(p.name) + '">'
        + '<div class="lbbar"><div class="lbt">' + esc(p.name) + '</div>'
        + (fs.length > 1 ? '<span class="lbc tnum">' + (i+1) + ' / ' + fs.length + '</span>'
            + '<button class="lbn" data-p aria-label="Anterior">‹</button>'
            + '<button class="lbn" data-n aria-label="Siguiente">›</button>' : '')
        + '</div>';
      lb.querySelector('[data-x]').onclick = closeLb;
      var pv = lb.querySelector('[data-p]'), nx = lb.querySelector('[data-n]');
      if(pv) pv.onclick = function(){ i = (i-1+fs.length)%fs.length; paint(); };
      if(nx) nx.onclick = function(){ i = (i+1)%fs.length; paint(); };
    }
    paint();
    lb.addEventListener('close', function(){
      if(lb){ lb.remove(); lb=null; }
      document.body.style.overflow = '';
      window.scrollTo(0, lbScroll);
    });
    lb.addEventListener('click', function(ev){ if(ev.target===lb) closeLb(); });

    /* el teclado va en el documento, no en el visor: al cambiar de foto se
       redibuja por dentro y el foco se perdería después de la primera tecla */
    function alTeclear(ev){
      if(!lb) return;
      if(ev.key === 'Escape'){ closeLb(); return; }
      if(fs.length < 2) return;
      if(ev.key === 'ArrowRight'){ ev.preventDefault(); i = (i+1)%fs.length; paint(); }
      if(ev.key === 'ArrowLeft'){  ev.preventDefault(); i = (i-1+fs.length)%fs.length; paint(); }
    }
    document.addEventListener('keydown', alTeclear);
    lb.addEventListener('close', function(){ document.removeEventListener('keydown', alTeclear); });

    /* pasar fotos deslizando con el dedo */
    var x0 = null;
    lb.addEventListener('touchstart', function(ev){ x0 = ev.touches[0].clientX; }, { passive:true });
    lb.addEventListener('touchend', function(ev){
      if(x0 === null || fs.length < 2) return;
      var dx = ev.changedTouches[0].clientX - x0; x0 = null;
      if(Math.abs(dx) > 45){ i = (i + (dx < 0 ? 1 : -1) + fs.length) % fs.length; paint(); }
    }, { passive:true });

    document.body.appendChild(lb);

    /* si el navegador del celular es viejo y no soporta showModal, lo abrimos a mano */
    if(typeof lb.showModal === 'function'){
      try{ lb.showModal(); }
      catch(e){ lb.setAttribute('open',''); lb.classList.add('lb-plano'); }
    } else {
      lb.setAttribute('open','');
      lb.classList.add('lb-plano');
    }
    document.body.style.overflow = 'hidden';
  }

  function dialog(title, body, onSave, saveLabel){
    var d = document.createElement('dialog');

    document.body.appendChild(d);

    d.querySelector('[data-x="s"]').onclick = function(){ if(onSave(d)!==false){ d.close(); d.remove(); render(); } };

  function shrink(file, max, cb){
    var fr = new FileReader();
    fr.onload = function(){
      var img = new Image();
      img.onload = function(){
        var w=img.width, hh=img.height, M=max||900;
        if(w>M||hh>M){ var r=Math.min(M/w,M/hh); w=Math.round(w*r); hh=Math.round(hh*r); }
        var cv=document.createElement('canvas'); cv.width=w; cv.height=hh;
        var cx=cv.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,w,hh); cx.drawImage(img,0,0,w,hh);
        cb(cv.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = function(){ cb(null); };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  }

      fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=' + FB_API_KEY, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ email:e, password:p, returnSecureToken:true })
      }).then(function(r){ return r.json(); }).then(function(j){
        if(j.idToken){
          admin.token = j.idToken; admin.email = j.email;
          try{ sessionStorage.setItem('cake-adm', JSON.stringify({t:j.idToken, e:j.email})); }catch(x){}
          d.close(); d.remove(); render();

          err.textContent = 'No pudimos entrar. Revisá el correo y la contraseña.';

      return false;

  /* --------- mover producto --------- */
  function mover(id, dir){
    var i = idxById(id); if(i < 0) return;
    var p = state.products[i], j = -1;
    for(var k = i + dir; k >= 0 && k < state.products.length; k += dir){
      if(state.products[k].cat === p.cat){ j = k; break; }
    }
    if(j < 0) return;
    state.products[i] = state.products[j]; state.products[j] = p;
    touch(); render();
  }

  /* ===========================================================

  var sinMovimiento = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var ticking = false;
  window.addEventListener('scroll', function(){
    if(ticking) return;
    ticking = true;
    requestAnimationFrame(function(){
      document.body.classList.toggle('compacto', window.scrollY > 70);
      ticking = false;
    });
  }, { passive:true });

  function confeti(){
    if(sinMovimiento) return;
    var viejo = document.getElementById('confeti');
    if(viejo) viejo.remove();

    var cv = document.createElement('canvas');
    cv.id = 'confeti';
    var W = cv.width  = window.innerWidth;
    var H = cv.height = window.innerHeight;
    document.body.appendChild(cv);
    var cx = cv.getContext('2d');

    var COL = ['#C08552', '#895737', '#5E3023', '#F3E9DC', '#E9DAC5'];
    var piezas = [];
    for(var i = 0; i < 110; i++){
      piezas.push({
        x: W / 2 + (Math.random() - .5) * W * .5,
        y: H + 20 + Math.random() * 60,
        vx: (Math.random() - .5) * 7,
        vy: -(11 + Math.random() * 9),
        g: 0.24 + Math.random() * .12,
        w: 6 + Math.random() * 7,
        h: 9 + Math.random() * 9,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - .5) * .28,
        col: COL[(Math.random() * COL.length) | 0]
      });
    }

    var t0 = performance.now();
    (function cuadro(t){
      var vida = t - t0;
      cx.clearRect(0, 0, W, H);
      piezas.forEach(function(p){
        p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        cx.save();
        cx.translate(p.x, p.y);
        cx.rotate(p.rot);
        cx.globalAlpha = Math.max(0, 1 - vida / 2600);
        cx.fillStyle = p.col;
        cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        cx.restore();
      });
      if(vida < 2600) requestAnimationFrame(cuadro);
      else cv.remove();
    })(t0);
  }
